<style>
  :root{

    --malam-2:#2E1470;

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#140A38;overscroll-behavior:none}
  body{
    font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;

  #stage{display:block;width:100%;height:100%}
  #cam{position:fixed;top:-10px;left:-10px;width:1px;height:1px;opacity:0;pointer-events:none}

  #boot{

    background:radial-gradient(130% 100% at 50% 6%, #2E1470, #140A38 68%);

  #boot[hidden]{display:none}
  .kartu{max-width:30rem}
  .tanda{font-size:clamp(3rem,12vw,5rem);line-height:1}
  h1{font-size:clamp(1.7rem,6vw,2.5rem);font-weight:800;margin:.35rem 0 .55rem;letter-spacing:-.015em}
  #bootPesan{font-size:1.05rem;font-weight:500;color:var(--kabut);line-height:1.5}

  @keyframes geser{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
  @media (prefers-reduced-motion:reduce){.memuat i{animation:none;width:100%}}

<body>

<canvas id="stage" aria-label="Papan permainan puzzle"></canvas>
<video id="cam" playsinline muted autoplay></video>

<div id="boot">
  <div class="kartu">
    <div class="tanda">✋</div>
    <h1>Puzzle Udara</h1>
    <p id="bootPesan">Menyalakan kamera…</p>
    <div class="memuat" id="bootBar"><i></i></div>
    <ul id="bootBantuan" hidden></ul>
  </div>
</div>

<noscript><p style="padding:24px;text-align:center">Permainan ini membutuhkan JavaScript yang aktif.</p></noscript>

<!-- Pelacak tangan di-host sendiri: tidak ada permintaan ke CDN luar saat bermain. -->
<script src="./mediapipe/hands.js"></script>
<script src="./mediapipe/camera_utils.js"></script>
<script>
/* ============================================================
   PUZZLE UDARA v1.3.1
   Puzzle foto yang dimainkan sepenuhnya dengan gerakan tangan.
   Tanpa mouse, tanpa keyboard, tanpa build step.

   Kendali
     Telunjuk              -> menggerakkan kursor
     Tahan di atas tombol  -> menekan (dwell click, cincin kursor terisi)
     Cubit jempol+telunjuk -> mengambil & menyeret kepingan
     Buka tangan           -> melepas kepingan

   Semua aset (model tangan + wasm) di-host sendiri di ./mediapipe/.
   Uji coba dengan mouse: tambahkan ?mouse=1 pada URL.

   Peta modul ada di DEV.md.
   ============================================================ */
'use strict';

/* ============================================================
   M1 · Elemen & setelan
   ============================================================ */
var cv        = document.getElementById('stage');
var ctx       = cv.getContext('2d');
var video     = document.getElementById('cam');
var boot      = document.getElementById('boot');
var bootPesan = document.getElementById('bootPesan');
var bootBar   = document.getElementById('bootBar');
var bootHelp  = document.getElementById('bootBantuan');

var TINGKAT = {
  mudah : { grid:2, nama:'Mudah',  usia:'5–6 tahun',   warna:'#35E0A1' },
  sedang: { grid:3, nama:'Sedang', usia:'7–9 tahun',   warna:'#45C4FF' },
  sulit : { grid:4, nama:'Sulit',  usia:'10–13 tahun', warna:'#FF5FA2' }
};
var URUT_TINGKAT = ['mudah','sedang','sulit'];

var DWELL        = 1000;   // ms menahan kursor untuk menekan tombol
var CUBIT_ON     = 0.45;   // rasio cubit terhadap ukuran telapak -> menggenggam
var CUBIT_OFF    = 0.62;   // histeresis supaya genggaman tidak berkedip
var GAIN         = 1.30;   // perluas jangkauan tangan ke tepi layar
var SRC          = 720;    // resolusi foto yang dipotong
var DETIK_MUNDUR = 3;
var SNAP         = 0.55;   // toleransi tempel, dikali ukuran sel
var JEDA_PETUNJUK= 22000;  // ms tanpa kemajuan sebelum slot tujuan berkedip
var MP_DIR       = './mediapipe/';  // folder aset MediaPipe yang di-host sendiri
var MODEL        = 1;      // 0 = model ringan (tablet lawas), 1 = akurat

var UNGU_MUDA = '#B79CFF';

/* ============================================================
   M2 · Keadaan
   ============================================================ */
var W = 0, H = 0, DPR = 1, waktu = 0;
var layar = 'menu';                 // kalibrasi | menu | mundur | main | menang
var tingkat = 'sedang';
var GRID = 3;
var foto = null;
var keping = [];
var digenggam = null;
var tombol = [];
var hoverId = null, hoverT = 0;
var mundurSisa = 0;
var papan = { x:0, y:0, s:0, cell:0 };
var zonaSebar = [];
var areaMain = { x:0, y:0, w:0, h:0 };
var rakMenu  = { x:0, y:0, w:0, h:0 };
var konfeti = [], kilau = [], latarKeping = [];
var kamSiap = false;
var tanganAda = false;
var cursor = { x:0, y:0, ada:false };
var target = { x:0, y:0 };
var cubit = false;
var landmark = null;
var lastT = 0;
var pesan = '';
var suaraAktif = true;
var hematGerak = false;
var pakaiMouse = /[?&]mouse=1/.test(location.search);

var kalib = { lihat:0, cubitOk:false, selesai:0 };
var tanpaProgres = 0, petunjuk = null;

/* ============================================================
   M3 · Tata letak
   ============================================================ */
function jepit(v, a, b){ return Math.min(Math.max(v, a), b); }
function potret(){ return W < H * 1.15; }

function ukur(){
  var lamaW = W || window.innerWidth;
  var lamaH = H || window.innerHeight;

  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(320, window.innerWidth);
  H = Math.max(360, window.innerHeight);

  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  hitungPapan();
  susunTombol();
  siapkanLatar();
  if (keping.length) skalakanUlang(lamaW, lamaH);

  cursor.x = Math.min(cursor.x, W);
  cursor.y = Math.min(cursor.y, H);
}

function hitungPapan(){
  var atas = 96, bawah = 112;
  var tinggiMain = Math.max(180, H - atas - bawah);
  var s;

  areaMain = { x:8, y:atas, w:W - 16, h:tinggiMain };

  if (potret()){
    s = Math.max(160, Math.min(W * 0.88, tinggiMain * 0.62));
    papan = { x:(W - s)/2, y:atas + 2, s:s, cell:s/GRID };
    var yStrip = papan.y + s + 14;
    var hStrip = Math.max(papan.cell * 1.05, (atas + tinggiMain) - yStrip);
    zonaSebar = [{ x:10, y:yStrip, w:Math.max(papan.cell, W - 20), h:hStrip }];
  } else {
    s = Math.max(160, Math.min(tinggiMain * 0.94, W * 0.44));
    papan = { x:(W - s)/2, y:atas + (tinggiMain - s)/2, s:s, cell:s/GRID };
    var pita = Math.max(papan.cell * 1.05, papan.x - 22);
    zonaSebar = [
      { x:10, y:atas, w:pita, h:tinggiMain },
      { x:Math.min(W - pita - 10, papan.x + s + 10), y:atas, w:pita, h:tinggiMain }
    ];
  }
}

/* ============================================================
   M4 · Tombol tanpa sentuh (dwell click)
   ============================================================ */
function tbl(id, label, sub, x, y, w, h, warna, aksi, gaya){
  return { id:id, label:label, sub:sub, x:x, y:y, w:w, h:h,
           warna:warna, aksi:aksi, gaya:gaya || 'pil', grid:0 };
}

function susunTombol(){
  tombol = [];
  var w, h, jarak, x0, y, total, i, t, n;

  if (layar === 'kalibrasi'){
    w = Math.min(230, W - 60); h = 62;
    tombol.push(tbl('lewati', 'Lewati', null, (W - w)/2, Math.min(H - h - 26, H * 0.86),
      w, h, UNGU_MUDA, keMenu));
  }

  if (layar === 'menu'){
    n = URUT_TINGKAT.length;
    jarak = 14;
    // Kartu dimulai di bawah pratinjau kamera + judul. Tanpa ini, di lebar
    // HP judul yang di-tengah menabrak pratinjau di pojok kanan-atas.
    var kam = kotakKamera();
    var margAtas  = Math.max(122, H * 0.30, kam.y + kam.h + 104);
    var margBawah = 96;
    var sisa = Math.max(120, H - margAtas - margBawah);

    if (potret()){
      w = Math.min(430, W - 40);
      h = jepit(Math.min(118, (sisa - jarak * (n - 1)) / n), 44, 118);
      total = h * n + jarak * (n - 1);
      x0 = (W - w) / 2;
      y  = margAtas + Math.max(0, (sisa - total) / 2);
      rakMenu = { x:x0, y:y, w:w, h:total };
      for (i = 0; i < n; i++){
        t = TINGKAT[URUT_TINGKAT[i]];
        tombol.push(kartuTingkat(URUT_TINGKAT[i], t, x0, y + i * (h + jarak), w, h));
      }
    } else {
      jarak = 18;
      w = Math.min(258, (W - 48 - jarak * (n - 1)) / n);
      h = jepit(Math.min(150, sisa), 60, 150);
      total = w * n + jarak * (n - 1);
      x0 = (W - total) / 2;
      y  = margAtas + Math.max(0, (sisa - h) / 2);
      rakMenu = { x:x0, y:y, w:total, h:h };
      for (i = 0; i < n; i++){
        t = TINGKAT[URUT_TINGKAT[i]];
        tombol.push(kartuTingkat(URUT_TINGKAT[i], t, x0 + i * (w + jarak), y, w, h));
      }
    }

    var sw = 104, sh = 46;
    tombol.push(tbl('suara', suaraAktif ? 'Suara aktif' : 'Suara mati', null,
      16, 16, sw, sh, suaraAktif ? '#35E0A1' : 'rgba(255,255,255,.45)', gantiSuara, 'kecil'));
  }

  if (layar === 'main'){
    jarak = 12;
    w = Math.min(190, (W - 48 - jarak * 2) / 3);
    h = 60;
    total = w * 3 + jarak * 2;
    x0 = (W - total) / 2;
    y  = Math.min(H - h - 24, H - 84);
    tombol.push(tbl('acak', 'Acak lagi',     null, x0,                 y, w, h, '#45C4FF', acakKeping));
    tombol.push(tbl('foto', 'Foto ulang',    null, x0 + (w + jarak),   y, w, h, '#FFB020', mulaiMundur));
    tombol.push(tbl('menu', 'Ganti tingkat', null, x0 + 2*(w + jarak), y, w, h, UNGU_MUDA, keMenu));
  }

  if (layar === 'menang'){
    jarak = 16;
    w = Math.min(236, (W - 48 - jarak) / 2);
    h = 74;
    total = w * 2 + jarak;
    x0 = (W - total) / 2;
    y  = jepit(H / 2 + 92, 80, H - h - 26);
    tombol.push(tbl('lagi',  'Main lagi',     'foto baru', x0,             y, w, h, '#35E0A1', mulaiMundur));
    tombol.push(tbl('menu2', 'Ganti tingkat', null,        x0 + w + jarak, y, w, h, UNGU_MUDA, keMenu));
  }

  hoverId = null; hoverT = 0;
}

function kartuTingkat(kunci, t, x, y, w, h){
  var b = tbl('lv-' + kunci, t.nama, t.usia, x, y, w, h, t.warna, mulaiTingkat.bind(null, kunci), 'kartu');
  b.grid = t.grid;
  return b;
}

function gantiLayar(l){
  layar = l;
  hitungPapan();
  susunTombol();
}

function gantiSuara(){
  suaraAktif = !suaraAktif;
  susunTombol();
  if (suaraAktif) bunyi(760, 0.1);
}

/* ============================================================
   M5 · Alur permainan
   ============================================================ */
function mulaiTingkat(k){
  tingkat = k;
  GRID = TINGKAT[k].grid;
  hitungPapan();
  mulaiMundur();
}

function mulaiMundur(){
  mundurSisa = DETIK_MUNDUR;
  digenggam = null;
  gantiLayar('mundur');
  bunyi(660, 0.12);
}

function kameraPunyaGambar(){
  return !!(video && video.videoWidth > 0 && video.videoHeight > 0 && video.readyState >= 2);
}

function jepret(){
  if (!kameraPunyaGambar()) return false;
  var vw = video.videoWidth, vh = video.videoHeight;
  var c = document.createElement('canvas');
  c.width = c.height = SRC;
  var g = c.getContext('2d');
  var sisi = Math.min(vw, vh);
  g.translate(SRC, 0); g.scale(-1, 1);        // cermin, agar sama dengan yang dilihat anak
  try {
    g.drawImage(video, (vw - sisi)/2, (vh - sisi)/2, sisi, sisi, 0, 0, SRC, SRC);
  } catch (e){
    return false;                             // frame belum bisa digambar, coba lagi
  }
  foto = c;
  buatKeping();
  gantiLayar('main');
  pesan = 'Cubit kepingannya, lalu tarik ke tempatnya';
  tanpaProgres = 0; petunjuk = null;
  bunyi(880, 0.16);
  return true;
}

function buatKeping(){
  keping = [];
  for (var i = 0; i < GRID * GRID; i++){
    keping.push({ col:i % GRID, row:Math.floor(i / GRID), x:0, y:0, pas:false, anim:null, denyut:0 });
  }
  acakKeping();
}

function acakKeping(){
  digenggam = null;
  var sudah = [];
  for (var i = 0; i < keping.length; i++){
    keping[i].pas = false;
    keping[i].anim = null;
    sebar(keping[i], sudah);
    sudah.push(keping[i]);
  }
  tanpaProgres = 0; petunjuk = null;
  if (layar === 'main') pesan = 'Cubit kepingannya, lalu tarik ke tempatnya';
}

/* Titik acak paling renggang dari kepingan lain, supaya tidak menumpuk. */
function sebar(p, sudah){
  var c = papan.cell, terbaik = null, skorTerbaik = -1;
  for (var coba = 0; coba < 14; coba++){
    var z = zonaSebar[Math.floor(Math.random() * zonaSebar.length)] || areaMain;
    var kx = z.x + Math.random() * Math.max(1, Math.max(z.x, z.x + z.w - c) - z.x);
    var ky = z.y + Math.random() * Math.max(1, Math.max(z.y, z.y + z.h - c) - z.y);
    var skor = Infinity;
    if (sudah) for (var i = 0; i < sudah.length; i++){
      var d = Math.hypot(kx - sudah[i].x, ky - sudah[i].y);
      if (d < skor) skor = d;
    }
    if (skor > skorTerbaik){ skorTerbaik = skor; terbaik = { x:kx, y:ky }; }
    if (skorTerbaik > c * 0.8) break;
  }
  p.x = terbaik.x; p.y = terbaik.y;
  jagaDiArea(p);        // zona sebar bisa melewati area main di layar pendek
}

/* Resize: pertahankan posisi relatif, jangan diacak ulang. */
function skalakanUlang(lamaW, lamaH){
  var rx = W / (lamaW || W), ry = H / (lamaH || H);
  for (var i = 0; i < keping.length; i++){
    var p = keping[i];
    p.anim = null;
    if (p.pas){
      p.x = papan.x + p.col * papan.cell;
      p.y = papan.y + p.row * papan.cell;
    } else {
      p.x *= rx; p.y *= ry;
      jagaDiArea(p);
    }
  }
}

function jagaDiArea(p){
  var c = papan.cell;
  p.x = jepit(p.x, areaMain.x, areaMain.x + areaMain.w - c);
  p.y = jepit(p.y, areaMain.y, areaMain.y + areaMain.h - c);
}

function keMenu(){
  foto = null; keping = []; digenggam = null;
  konfeti = []; kilau = []; petunjuk = null;
  pesan = '';
  gantiLayar('menu');
}

function cekMenang(){
  if (!keping.length) return;
  for (var i = 0; i < keping.length; i++) if (!keping[i].pas) return;
  gantiLayar('menang');
  taburKonfeti();
  bunyi(523, 0.12);
  setTimeout(function(){ bunyi(659, 0.12); }, 120);
  setTimeout(function(){ bunyi(784, 0.26); }, 250);
}

/* ============================================================
   M6 · Cubit: ambil & lepas
   ============================================================ */
function ambil(){
  if (layar !== 'main' || !foto) return;
  var c = papan.cell;
  for (var i = keping.length - 1; i >= 0; i--){
    var p = keping[i];
    if (p.pas) continue;
    if (cursor.x >= p.x && cursor.x <= p.x + c && cursor.y >= p.y && cursor.y <= p.y + c){
      keping.splice(i, 1); keping.push(p);      // bawa ke lapisan paling atas
      p.anim = null;
      digenggam = p;
      hoverId = null; hoverT = 0;
      petunjuk = null; tanpaProgres = 0;
      bunyi(440, 0.06, 'triangle', 0.05);
      return;
    }
  }
}

function lepas(){
  if (!digenggam) return;
  var p = digenggam;
  digenggam = null;
  var c = papan.cell;
  var tx = papan.x + p.col * c, ty = papan.y + p.row * c;
  if (Math.hypot(p.x - tx, p.y - ty) < c * SNAP){
    p.anim = { x0:p.x, y0:p.y, t:0, dur:hematGerak ? 1 : 170 };
    p.x = tx; p.y = ty; p.pas = true; p.denyut = 1;
    taburKilau(tx + c/2, ty + c/2);
    tanpaProgres = 0; petunjuk = null;
    bunyi(740, 0.1, 'square', 0.05);
    cekMenang();
  } else {
    jagaDiArea(p);                              // jangan menutupi baris tombol
  }
}

/* ============================================================
   M7 · Pelacakan tangan (MediaPipe Hands)
   ============================================================ */
function jarak(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }

function onResults(res){
  var lm = (res && res.multiHandLandmarks && res.multiHandLandmarks.length)
    ? res.multiHandLandmarks[0] : null;
  landmark = lm;

  if (!lm){
    tanganAda = false;
    if (cubit){ cubit = false; lepas(); }
    return;
  }
  tanganAda = true;

  var telunjuk = lm[8], jempol = lm[4];
  // jangkauan diperlebar dari titik tengah supaya sudut layar tetap terjangkau
  target.x = jepit((1 - telunjuk.x - 0.5) * GAIN + 0.5, 0, 1) * W;
  target.y = jepit((telunjuk.y - 0.5) * GAIN + 0.5, 0, 1) * H;
  cursor.ada = true;

  // cubit diukur relatif ukuran telapak -> jauh/dekat kamera terasa sama
  var skala = Math.max(1e-4, jarak(lm[0], lm[9]));
  var rasio = jarak(telunjuk, jempol) / skala;
  var baru = cubit ? (rasio < CUBIT_OFF) : (rasio < CUBIT_ON);

  if (baru && !cubit){ ambil(); kalib.cubitOk = true; }
  else if (!baru && cubit) lepas();
  cubit = baru;
}

/* ============================================================
   M8 · Perbarui
   ============================================================ */
function perbarui(dt){
  waktu += dt;

  if (cursor.ada){
    var d = Math.hypot(target.x - cursor.x, target.y - cursor.y);
    var a = Math.min(0.75, 0.22 + d / 260);     // gesit saat jauh, tenang saat hampir diam
    cursor.x += (target.x - cursor.x) * a;
    cursor.y += (target.y - cursor.y) * a;
  }

  if (digenggam){
    if (layar !== 'main') digenggam = null;
    else {
      digenggam.x = cursor.x - papan.cell / 2;
      digenggam.y = cursor.y - papan.cell / 2;
    }
  }

  // dwell click
  if (tanganAda && !digenggam && !cubit){
    var atas = null;
    for (var i = 0; i < tombol.length; i++){
      var b = tombol[i];
      if (cursor.x > b.x && cursor.x < b.x + b.w && cursor.y > b.y && cursor.y < b.y + b.h){ atas = b; break; }
    }
    if (atas){
      if (atas.id !== hoverId){ hoverId = atas.id; hoverT = 0; bunyi(520, 0.05, 'sine', 0.03); }
      hoverT += dt;
      if (hoverT >= DWELL){
        hoverId = null; hoverT = 0;
        bunyi(880, 0.1);
        atas.aksi();
        return;                                  // aksi bisa mengganti layar
      }
    } else { hoverId = null; hoverT = 0; }
  } else { hoverId = null; hoverT = 0; }

  if (layar === 'kalibrasi'){
    if (tanganAda) kalib.lihat += dt; 
    if (kalib.lihat > 700 && kalib.cubitOk){
      kalib.selesai += dt;
      if (kalib.selesai > 900){ tandaiKalibrasi(); keMenu(); }
    }
  }

  if (layar === 'mundur'){
    mundurSisa -= dt / 1000;
    if (mundurSisa <= 0){ mundurSisa = 0; jepret(); }
  }

  if (layar === 'main'){
    tanpaProgres += dt;
    if (!petunjuk && tanpaProgres > JEDA_PETUNJUK){
      for (var k = 0; k < keping.length; k++){
        if (!keping[k].pas){ petunjuk = { p:keping[k], t:2600 }; break; }
      }
    }
    if (petunjuk){
      petunjuk.t -= dt;
      if (petunjuk.t <= 0){ petunjuk = null; tanpaProgres = 0; }
    }
  }

  for (var j = 0; j < keping.length; j++){
    var p = keping[j];
    if (p.anim){ p.anim.t += dt; if (p.anim.t >= p.anim.dur) p.anim = null; }
    if (p.denyut > 0) p.denyut = Math.max(0, p.denyut - dt / 420);
  }

  majukanPartikel(konfeti, dt, 620, H + 40);
  for (var q = kilau.length - 1; q >= 0; q--){
    var s = kilau[q];
    s.x += s.vx * dt/1000; s.y += s.vy * dt/1000;
    s.vy += 180 * dt/1000; s.hidup -= dt;
    if (s.hidup <= 0) kilau.splice(q, 1);
  }
  if (!hematGerak) for (var b2 = 0; b2 < latarKeping.length; b2++){
    var f = latarKeping[b2];
    f.y -= f.v * dt/1000; f.r += f.vr * dt/1000;
    if (f.y < -f.s) { f.y = H + f.s; f.x = Math.random() * W; }
  }
}

function majukanPartikel(arr, dt, grav, batas){
  for (var i = arr.length - 1; i >= 0; i--){
    var k = arr[i];
    k.vy += grav * dt/1000;
    k.x += k.vx * dt/1000;
    k.y += k.vy * dt/1000;
    k.r += k.vr * dt/1000;
    if (k.y > batas) arr.splice(i, 1);
  }
}

var WARNA_PESTA = ['#FFB020','#35E0A1','#FF5FA2','#45C4FF','#FFFFFF'];

function taburKonfeti(){
  konfeti.length = 0;
  if (hematGerak) return;
  for (var i = 0; i < 130; i++){
    konfeti.push({
      x: W/2 + (Math.random()-0.5) * W * 0.5, y: H * 0.42,
      vx: (Math.random()-0.5) * 620, vy: -Math.random() * 620 - 120,
      r: Math.random() * 6, vr: (Math.random()-0.5) * 10,
      w: 6 + Math.random() * 8, h: 8 + Math.random() * 10,
      c: WARNA_PESTA[Math.floor(Math.random() * WARNA_PESTA.length)]
    });
  }
}

function taburKilau(x, y){
  if (hematGerak) return;
  for (var i = 0; i < 16; i++){
    var a = Math.random() * Math.PI * 2, v = 70 + Math.random() * 190;
    kilau.push({ x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v,
                 hidup:480 + Math.random()*260, maks:740,
                 c: WARNA_PESTA[Math.floor(Math.random() * WARNA_PESTA.length)] });
  }
}

function siapkanLatar(){
  latarKeping = [];
  var n = Math.round(jepit(W * H / 90000, 6, 16));
  for (var i = 0; i < n; i++){
    latarKeping.push({
      x: Math.random() * W, y: Math.random() * H,
      s: 26 + Math.random() * 62, v: 6 + Math.random() * 14,
      r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.25
    });
  }
}

/* ============================================================
   M9 · Primitif gambar
   ============================================================ */
function bulat(x, y, w, h, r){
  var rr = Math.max(0, Math.min(r, w/2, h/2));
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y,     x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x,     y + h, rr);
  ctx.arcTo(x,     y + h, x,     y,     rr);
  ctx.arcTo(x,     y,     x + w, y,     rr);
  ctx.closePath();
}

function teks(t, x, y, ukuran, berat, warna, rata){
  ctx.font = berat + ' ' + ukuran + 'px "Baloo 2", system-ui, sans-serif';
  ctx.fillStyle = warna;
  ctx.textAlign = rata || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y);
}

/* Kecilkan huruf sampai muat selebar `maks`. Label seperti "Ganti tingkat"
   lebih panjang dari pilnya di lebar HP dan tanpa ini meluber keluar. */
function teksMuat(t, x, y, ukuran, berat, warna, rata, maks){
  var u = ukuran;
  for (var i = 0; i < 10 && u > 9; i++){
    ctx.font = berat + ' ' + u + 'px "Baloo 2", system-ui, sans-serif';
    if (ctx.measureText(t).width <= maks) break;
    u = Math.max(9, u * 0.92);
  }
  teks(t, x, y, u, berat, warna, rata);
}

function mulus(t){ return t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3); }

function latar(){
  var g = ctx.createRadialGradient(W*0.5, H*0.02, 40, W*0.5, H*0.02, Math.max(W, H) * 1.15);
  g.addColorStop(0, '#34177E');
  g.addColorStop(0.55, '#200F55');
  g.addColorStop(1, '#140A38');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  if (layar === 'menu' || layar === 'kalibrasi'){
    ctx.save();
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = '#fff';
    for (var i = 0; i < latarKeping.length; i++){
      var f = latarKeping[i];
      ctx.save();
      ctx.translate(f.x, f.y); ctx.rotate(f.r);
      bulat(-f.s/2, -f.s/2, f.s, f.s, f.s * 0.26);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
}

/* Petak mini sebagai pratinjau tingkat kesulitan pada kartu menu. */
function petakMini(x, y, ukuran, n, warna, alpha){
  var sel = ukuran / n;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = warna;
  ctx.lineWidth = 2;
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++){
    bulat(x + c*sel + 2, y + r*sel + 2, sel - 4, sel - 4, 3);
    ctx.stroke();
  }
  ctx.restore();
}

function gambarTombol(b){
  var aktif = b.id === hoverId;
  var p = aktif ? Math.min(1, hoverT / DWELL) : 0;
  var naik = aktif ? 3 : 0;
  var x = b.x, y = b.y - naik, w = b.w, h = b.h;
  var r = b.gaya === 'kartu' ? 26 : 20;

  ctx.save();
  if (aktif){ ctx.shadowColor = b.warna; ctx.shadowBlur = 22; }
  bulat(x, y, w, h, r);
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  ctx.fill();
  ctx.restore();

  ctx.save();                                    // isi mengikuti lama tahan
  bulat(x, y, w, h, r); ctx.clip();
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = b.warna;
  ctx.fillRect(x, y, w * p, h);
  ctx.restore();

  ctx.save();
  bulat(x, y, w, h, r);
  ctx.lineWidth = aktif ? 3 : 2;
  ctx.strokeStyle = aktif ? b.warna : 'rgba(255,255,255,.26)';
  ctx.stroke();
  ctx.restore();

  var gelap = p > 0.55;
  var utama = gelap ? '#140A38' : '#fff';
  var kedua = gelap ? 'rgba(20,10,56,.72)' : 'rgba(255,255,255,.55)';

  if (b.gaya === 'kartu'){
    var lebar = potret();
    var mini = Math.min(h - 26, lebar ? h - 26 : w * 0.34);
    var mx = lebar ? x + 20 : x + (w - mini)/2;
    var my = lebar ? y + (h - mini)/2 : y + 14;
    petakMini(mx, my, mini, b.grid, gelap ? '#140A38' : b.warna, gelap ? 0.5 : 0.85);
    var tx     = lebar ? mx + mini + 18 : x + w/2;
    var rata   = lebar ? 'left' : 'center';
    var yJudul = lebar ? y + h/2 - 11 : my + mini + 16;
    var ySub   = lebar ? y + h/2 + 14 : my + mini + 38;
    var maks   = lebar ? (x + w - 14) - tx : w - 20;
    teksMuat(b.label, tx, yJudul, Math.min(27, h * 0.26), 700, utama, rata, maks);
    teksMuat(b.grid + '×' + b.grid + ' · ' + b.sub, tx, ySub,
             Math.min(16, h * 0.16), 500, kedua, rata, maks);
  } else if (b.gaya === 'kecil'){
    teksMuat(b.label, x + w/2, y + h/2, 15, 600, utama, 'center', w - 14);
  } else {
    var cy = b.sub ? y + h/2 - 11 : y + h/2;
    teksMuat(b.label, x + w/2, cy, Math.min(22, h * 0.34), 700, utama, 'center', w - 16);
    if (b.sub) teksMuat(b.sub, x + w/2, y + h/2 + 14, 14, 500, kedua, 'center', w - 16);
  }
}

/* ============================================================
   M10 · Papan & kepingan
   ============================================================ */
function gambarPapan(){
  var x = papan.x, y = papan.y, s = papan.s, cell = papan.cell;

  ctx.save();
  bulat(x - 8, y - 8, s + 16, s + 16, 28);
  ctx.fillStyle = 'rgba(0,0,0,.30)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.10)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();

  if (foto){
    ctx.save();
    bulat(x, y, s, s, 20); ctx.clip();
    ctx.globalAlpha = 0.15;                      // bayangan gambar utuh sebagai petunjuk
    ctx.drawImage(foto, 0, 0, SRC, SRC, x, y, s, s);
    ctx.restore();
  }

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.14)';
  ctx.lineWidth = 1;
  for (var i = 1; i < GRID; i++){
    ctx.beginPath(); ctx.moveTo(x + i*cell, y); ctx.lineTo(x + i*cell, y + s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y + i*cell); ctx.lineTo(x + s, y + i*cell); ctx.stroke();
  }
  bulat(x, y, s, s, 20);
  ctx.strokeStyle = 'rgba(255,255,255,.32)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  if (digenggam) sorotSlot(digenggam,
    Math.hypot(digenggam.x - (x + digenggam.col*cell), digenggam.y - (y + digenggam.row*cell)) < cell * SNAP
      ? '#35E0A1' : 'rgba(255,255,255,.45)', 1);

  if (petunjuk && petunjuk.p && !petunjuk.p.pas){
    var kedip = 0.45 + 0.55 * Math.abs(Math.sin(waktu / 260));
    sorotSlot(petunjuk.p, '#FFB020', kedip);
  }
}

function sorotSlot(p, warna, alpha){
  var c = papan.cell;
  var tx = papan.x + p.col * c, ty = papan.y + p.row * c;
  ctx.save();
  ctx.globalAlpha = alpha;
  bulat(tx + 4, ty + 4, c - 8, c - 8, 12);
  ctx.setLineDash([10, 7]);
  ctx.lineWidth = 4;
  ctx.strokeStyle = warna;
  ctx.stroke();
  ctx.restore();
}

function gambarKeping(p, diangkat){
  if (!foto) return;
  var c = papan.cell, sc = SRC / GRID;
  var px = p.x, py = p.y, skala = 1;

  if (p.anim){
    var k = mulus(p.anim.t / p.anim.dur);
    px = p.anim.x0 + (p.x - p.anim.x0) * k;
    py = p.anim.y0 + (p.y - p.anim.y0) * k;
  }
  if (diangkat) skala = 1.07;
  else if (p.denyut > 0) skala = 1 + 0.10 * Math.sin(p.denyut * Math.PI);

  ctx.save();
  ctx.translate(px + c/2, py + c/2);
  ctx.scale(skala, skala);
  ctx.translate(-c/2, -c/2);

  if (diangkat){
    ctx.shadowColor = 'rgba(0,0,0,.6)';
    ctx.shadowBlur = 28;
    ctx.shadowOffsetY = 12;
  }
  bulat(0, 0, c, c, 11);
  ctx.save(); ctx.clip();
  ctx.drawImage(foto, p.col * sc, p.row * sc, sc, sc, 0, 0, c, c);
  ctx.restore();
  ctx.lineWidth = p.pas ? 3 : 2.5;
  ctx.strokeStyle = p.pas ? 'rgba(53,224,161,.95)' : 'rgba(255,255,255,.8)';
  ctx.stroke();
  ctx.restore();
}

/* ============================================================
   M11 · Kursor & pratinjau kamera
   ============================================================ */

/* Kotak pratinjau kamera di pojok kanan-atas — satu-satunya sumber posisinya.
   Layar menu dan layar main memakainya untuk menyisakan ruang, supaya judul
   dan bilah kemajuan tidak tertimpa di layar sempit.

   Ruangnya disisakan tanpa melihat kamSiap: tata letak dihitung sekali di
   ukur()/susunTombol(), sedangkan pratinjaunya baru muncul beberapa detik
   kemudian. Kalau ikut kamSiap, tata letak tidak pernah dihitung ulang dan
   tabrakannya balik lagi. */
function kotakKamera(){
  var w = Math.min(150, W * 0.28);
  return { x:W - w - 16, y:16, w:w, h:w * 0.75 };
}

function gambarKursor(){
  if (!cursor.ada || !tanganAda) return;
  var r = cubit ? 14 : 23;
  var warna = cubit ? '#35E0A1' : '#FFB020';

  ctx.save();
  ctx.beginPath(); ctx.arc(cursor.x, cursor.y, r + 7, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fill();

  ctx.beginPath(); ctx.arc(cursor.x, cursor.y, r, 0, Math.PI*2);
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.stroke();

  if (hoverId && hoverT > 0){                    // cincin dwell mengelilingi kursor
    var p = Math.min(1, hoverT / DWELL);
    ctx.beginPath();
    ctx.arc(cursor.x, cursor.y, r + 4, -Math.PI/2, -Math.PI/2 + p * Math.PI * 2);
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.strokeStyle = warna;
    ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(cursor.x, cursor.y, r, 0, Math.PI*2);
    ctx.lineWidth = 4;
    ctx.strokeStyle = warna;
    ctx.stroke();
  }

  ctx.beginPath(); ctx.arc(cursor.x, cursor.y, 4.5, 0, Math.PI*2);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.restore();
}

var SAMBUNG = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
               [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function gambarKamera(x, y, w, h, label){
  var r = 16;
  ctx.save();
  bulat(x, y, w, h, r); ctx.clip();
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.fillRect(x, y, w, h);
  ctx.translate(x + w, y); ctx.scale(-1, 1);
  if (kameraPunyaGambar()){
    try {
      var vw = video.videoWidth, vh = video.videoHeight;
      var sisi = Math.min(vw, vh * (w / h));
      ctx.globalAlpha = 0.62;
      ctx.drawImage(video, (vw - sisi)/2, 0, sisi, vh, 0, 0, w, h);
      ctx.globalAlpha = 1;
    } catch (e){ /* frame belum siap */ }
  }
  if (landmark){
    ctx.strokeStyle = cubit ? '#35E0A1' : '#FFB020';
    ctx.lineWidth = Math.max(2, w / 70);
    for (var i = 0; i < SAMBUNG.length; i++){
      var a = landmark[SAMBUNG[i][0]], b = landmark[SAMBUNG[i][1]];
      ctx.beginPath();
      ctx.moveTo(a.x * w, a.y * h); ctx.lineTo(b.x * w, b.y * h);
      ctx.stroke();
    }
    ctx.fillStyle = '#fff';
    for (var j = 0; j < landmark.length; j++){
      ctx.beginPath(); ctx.arc(landmark[j].x * w, landmark[j].y * h, Math.max(2, w/60), 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();

  ctx.save();
  bulat(x, y, w, h, r);
  ctx.strokeStyle = tanganAda ? 'rgba(53,224,161,.6)' : 'rgba(255,255,255,.2)';
  ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();

  if (label) teks(label, x + w/2, y + h + 14, 13, 600, 'rgba(255,255,255,.45)');
}

  ];
  var cy = py + p * 0.75 + 40;
  for (var i = 0; i < ck.length; i++){
    var w = Math.min(340, W - 56), x = (W - w)/2, y = cy + i * 50;

    ctx.fillStyle = ck[i].ok ? 'rgba(53,224,161,.16)' : 'rgba(255,255,255,.06)';
    ctx.fill();
    ctx.restore();
    teks(ck[i].ok ? '✓' : '·', x + 24, y + 20, 20, 700, ck[i].ok ? '#35E0A1' : 'rgba(255,255,255,.4)');
    teks(ck[i].t, x + 44, y + 20, 16, 600, ck[i].ok ? '#35E0A1' : 'rgba(255,255,255,.6)', 'left');

}

function gambarMundur(){

/* Rata kiri, bukan di tengah: pratinjau kamera memakai pojok kanan-atas
   dan di lebar HP (<= ~420px) bilah yang di-tengah selalu tertimpa. */
function bilahKotak(){
  var x = 16, y = 62, h = 9;
  return { x:x, y:y, h:h, w:Math.max(72, Math.min(280, kotakKamera().x - 14 - x)) };

function gambarBilah(selesai, jumlah){

    bulat(x, y, Math.max(h, w * (selesai / jumlah)), h, 99);

function gambarMain(){

       petunjuk ? '#FFB020' : 'rgba(255,255,255,.45)');
}

function bintang(x, y, r, warna){
  ctx.save();
  ctx.beginPath();
  for (var i = 0; i < 10; i++){
    var rad = (i % 2 === 0) ? r : r * 0.45;
    var a = -Math.PI/2 + i * Math.PI/5;
    ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a)*rad, y + Math.sin(a)*rad);
  }
  ctx.closePath();
  ctx.fillStyle = warna; ctx.fill();
  ctx.restore();
}

function gambarMenang(){
  gambarPapan();
  for (var i = 0; i < keping.length; i++) gambarKeping(keping[i], false);
  ctx.fillStyle = 'rgba(20,10,56,.74)';
  ctx.fillRect(0, 0, W, H);

  var cy = Math.min(H/2 - 36, H * 0.42);
  for (var b = 0; b < 3; b++){
    var d = (b - 1) * 54;
    var naik = hematGerak ? 0 : Math.sin(waktu/420 + b) * 5;
    bintang(W/2 + d, cy - 76 + naik, b === 1 ? 26 : 20, '#FFB020');
  }
  teks('Selesai!', W/2, cy, Math.min(58, W * 0.125), 800, '#35E0A1');
  teks('Kamu menyusun ' + (GRID * GRID) + ' kepingan tanpa menyentuh apa pun',
       W/2, cy + 44, Math.min(18, W * 0.038), 500, 'rgba(255,255,255,.7)');
}

function gambarPartikel(){
  var i, k;
  for (i = 0; i < konfeti.length; i++){
    k = konfeti[i];
    ctx.save();
    ctx.translate(k.x, k.y); ctx.rotate(k.r);
    ctx.fillStyle = k.c;
    ctx.fillRect(-k.w/2, -k.h/2, k.w, k.h);
    ctx.restore();
  }
  for (i = 0; i < kilau.length; i++){
    k = kilau[i];
    ctx.save();
    ctx.globalAlpha = Math.max(0, k.hidup / k.maks);
    ctx.fillStyle = k.c;
    ctx.beginPath(); ctx.arc(k.x, k.y, 3, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function gambar(){
  latar();
  if (layar === 'kalibrasi') gambarKalibrasi();
  if (layar === 'menu')      gambarMenu();
  if (layar === 'mundur')    gambarMundur();
  if (layar === 'main')      gambarMain();
  if (layar === 'menang')    gambarMenang();

  for (var i = 0; i < tombol.length; i++) gambarTombol(tombol[i]);
  gambarPartikel();

  if (layar === 'menu' || layar === 'main' || layar === 'menang'){
    var k = kotakKamera();
    if (kamSiap) gambarKamera(k.x, k.y, k.w, k.h, null);
  }
  gambarKursor();
}

/* Loop dibungkus try/catch: satu galat gambar tidak membekukan permainan. */
function loop(t){
  var dt = Math.min(64, t - lastT);
  lastT = t;
  try { perbarui(dt); gambar(); }
  catch (e){ if (console && console.error) console.error('[puzzle-udara]', e); }
  requestAnimationFrame(loop);
}

/* ============================================================
   M13 · Suara
   ============================================================ */
var actx = null, suaraMati = false;
function bunyi(freq, dur, tipe, vol){
  if (suaraMati || !suaraAktif) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ suaraMati = true; return; }
    if (!actx) actx = new AC();
    if (actx.state === 'suspended'){
      var pr = actx.resume();
      if (pr && pr.catch) pr.catch(function(){});
    }
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = tipe || 'sine';
    o.frequency.value = freq;
    g.gain.value = (vol == null) ? 0.07 : vol;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur || 0.1));
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + (dur || 0.1) + 0.02);
  } catch (e){ suaraMati = true; }
}

/* ============================================================
   M14 · Cadangan mouse (hanya bila URL memuat ?mouse=1)
   ============================================================ */
if (pakaiMouse){
  window.addEventListener('mousemove', function(e){
    if (landmark) return;
    cursor.ada = true; tanganAda = true;
    target.x = cursor.x = e.clientX;
    target.y = cursor.y = e.clientY;
  });
  window.addEventListener('mousedown', function(){ if (!landmark){ cubit = true;  ambil(); } });
  window.addEventListener('mouseup',   function(){ if (!landmark){ cubit = false; lepas(); } });
}

/* ============================================================
   M15 · Kamera + MediaPipe
   ============================================================ */
function gagal(judul, langkah){
  bootPesan.textContent = judul;
  bootBar.hidden = true;
  bootHelp.hidden = false;
  bootHelp.innerHTML = langkah.map(function(l){ return '<li>' + l + '</li>'; }).join('');
  boot.hidden = false;
}

function pesanKameraGagal(e){
  var n = (e && e.name) || '';
  if (n === 'NotAllowedError' || n === 'SecurityError') return ['Izin kamera ditolak.', [
    'Klik ikon kamera di address bar, pilih <b>Izinkan</b>, lalu muat ulang halaman.',
    'Di Android Chrome: menu ⋮ → Setelan situs → Kamera → Izinkan.'
  ]];
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return ['Kamera tidak ditemukan.', [
    'Pastikan perangkat punya kamera depan yang aktif.',
    'Colokkan webcam eksternal lalu muat ulang halaman.'
  ]];
  if (n === 'NotReadableError' || n === 'AbortError') return ['Kamera sedang dipakai aplikasi lain.', [
    'Tutup Zoom, Google Meet, OBS, atau tab lain yang memakai kamera.',
    'Muat ulang halaman setelah aplikasi itu tertutup.'
  ]];
  return ['Kamera tidak bisa dibuka.', [
    'Muat ulang halaman dan izinkan akses kamera.',
    'Halaman harus dibuka lewat <b>https://</b> atau <b>http://localhost</b>.'
  ]];
}

function sudahPernahKalibrasi(){
  try { return window.localStorage.getItem('puzzleudara.kalibrasi') === '1'; }
  catch (e){ return false; }
}
function tandaiKalibrasi(){
  try { window.localStorage.setItem('puzzleudara.kalibrasi', '1'); } catch (e){}
}

function nyalakan(){
  if (typeof Hands === 'undefined' || typeof Camera === 'undefined'){
    gagal('Berkas pelacak tangan tidak ditemukan.', [
      'Pastikan folder <b>mediapipe/</b> ikut ter-upload di sebelah index.html.',
      'Jalankan <b>bash setup-mediapipe.sh</b> untuk mengunduh ulang asetnya.',
      'Muat ulang halaman.'
    ]);
    return;
  }

  var hands;
  try {
    hands = new Hands({ locateFile: function(f){ return MP_DIR + f; } });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: MODEL,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });
    hands.onResults(function(res){
      if (!kamSiap){
        kamSiap = true;
        boot.hidden = true;
        if (!sudahPernahKalibrasi()) gantiLayar('kalibrasi');
      }
      try { onResults(res); }
      catch (e){ if (console && console.error) console.error('[puzzle-udara] onResults', e); }
    });
  } catch (e){
    gagal('Pelacak tangan gagal disiapkan di browser ini.', [
      'Gunakan Chrome, Edge, atau Safari versi terbaru.',
      'Browser perlu mendukung WebAssembly.'
    ]);
    return;
  }

  var kamera = new Camera(video, {
    onFrame: function(){
      if (document.hidden) return Promise.resolve();   // hemat CPU saat tab tidak aktif
      // camera_utils memanggil onFrame() tanpa try/catch dan hanya melanjutkan
      // rantai requestAnimationFrame-nya lewat .then(). Satu lemparan sinkron
      // dari hands.send() akan mematikan pengiriman frame selamanya: permainan
      // tetap tergambar tapi tangan berhenti terdeteksi tanpa pesan apa pun.
      try { return hands.send({ image: video }).catch(function(){}); }
      catch (e){ return Promise.resolve(); }
    },
    width: 640, height: 480, facingMode: 'user'
  });

  bootPesan.textContent = 'Izinkan akses kamera untuk mulai bermain';

  // camera_utils menampilkan alert() berbahasa Inggris ("Failed to acquire
  // camera feed: …") sebelum melempar errornya. Di kios itu membingungkan;
  // kartu bantuan berbahasa Indonesia di bawah sudah menggantikannya.
  var alertAsli = window.alert;
  var alertDibungkam = true;
  window.alert = function(){};
  function pulihkanAlert(){
    if (!alertDibungkam) return;
    alertDibungkam = false;
    window.alert = alertAsli;
  }

  Promise.resolve(kamera.start())
    .then(function(){ pulihkanAlert(); bootPesan.textContent = 'Memuat pelacak tangan…'; })
    .catch(function(e){ pulihkanAlert(); var p = pesanKameraGagal(e); gagal(p[0], p[1]); });

  setTimeout(function(){
    pulihkanAlert();                              // jaga-jaga bila start() tak pernah selesai
    if (!kamSiap && bootHelp.hidden){
      gagal('Pelacak tangan lama sekali dimuat.', [
        'Cek apakah semua berkas di folder <b>mediapipe/</b> lengkap.',
        'Buka Console browser untuk melihat berkas mana yang 404.',
        'Muat ulang halaman.'
      ]);
    }
  }, 20000);
}

/* ============================================================
   M16 · Mulai
   ============================================================ */
if (location.protocol === 'file:'){
  gagal('Halaman dibuka sebagai berkas biasa (file://).', [
    'Browser hanya mengizinkan kamera pada <b>https://</b> atau <b>http://localhost</b>.',
    'Jalankan <b>python3 -m http.server 5500</b> di folder ini, lalu buka <b>http://localhost:5500</b>.',
    'Atau klik kanan index.html di VS Code → <b>Open with Live Server</b>.'
  ]);
} else if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
  gagal('Browser ini tidak mendukung akses kamera.', [
    'Gunakan Chrome, Edge, Firefox, atau Safari versi terbaru.',
    'Pastikan alamat situs memakai <b>https://</b>.'
  ]);
} else {
  try { hematGerak = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  catch (e){ hematGerak = false; }

  window.addEventListener('resize', ukur);
  window.addEventListener('orientationchange', function(){ setTimeout(ukur, 250); });
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  ukur();
  cursor.x = target.x = W / 2;
  cursor.y = target.y = H / 2;
  lastT = performance.now();
  requestAnimationFrame(loop);

  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ try { gambar(); } catch (e){} });
  }
  nyalakan();
}
</script>
