<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />

<meta name="description" content="Puzzle foto yang dimainkan sepenuhnya dengan gerakan tangan di depan kamera. Tanpa mouse, tanpa keyboard." />
<title>Puzzle Udara — kendali tangan tanpa sentuh</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%8B%3C/text%3E%3C/svg%3E" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./ikon.svg" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preload" href="./font/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin />
<style>
  /* Font di-host sendiri: nol permintaan ke jaringan luar saat bermain,
     sama seperti aset MediaPipe. Satu berkas variable (33 KB) menutup
     seluruh bobot 500-800 yang dipakai permainan ini. */
  @font-face{
    font-family:'Baloo 2';
    src:url('./font/baloo2-latin.woff2') format('woff2');
    font-weight:500 800;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --malam:#140A38;
    --malam-2:#2E1470;
    --mangga:#FFB020;
    --mint:#35E0A1;
    --kabut:rgba(255,255,255,.72);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#140A38;overscroll-behavior:none}
  body{
    font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:#fff;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  #stage{display:block;width:100%;height:100%}
  #cam{position:fixed;top:-10px;left:-10px;width:1px;height:1px;opacity:0;pointer-events:none}

  #boot{
    position:fixed;inset:0;z-index:10;display:grid;place-items:center;
    background:radial-gradient(130% 100% at 50% 6%, #2E1470, #140A38 68%);
    padding:28px calc(28px + env(safe-area-inset-left,0px));
    text-align:center;
  }
  #boot[hidden]{display:none}
  .kartu{max-width:30rem}
  .tanda{font-size:clamp(3rem,12vw,5rem);line-height:1}
  h1{font-size:clamp(1.7rem,6vw,2.5rem);font-weight:800;margin:.35rem 0 .55rem;letter-spacing:-.015em}
  #bootPesan{font-size:1.05rem;font-weight:500;color:var(--kabut);line-height:1.5}
  #bootBantuan{margin-top:1.1rem;font-size:.95rem;font-weight:500;color:rgba(255,255,255,.55);line-height:1.65;text-align:left}
  #bootBantuan li{margin:.35rem 0 .35rem 1.1rem}
  #bootBantuan b{color:var(--mangga);font-weight:700}
  .memuat{margin-top:1.4rem;height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
  .memuat[hidden]{display:none}
  .memuat i{display:block;height:100%;width:38%;border-radius:99px;background:var(--mint);animation:geser 1.1s ease-in-out infinite}
  @keyframes geser{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
  @media (prefers-reduced-motion:reduce){.memuat i{animation:none;width:100%}}
</style>
</head>
<body>

<canvas id="stage" aria-label="Papan permainan puzzle"></canvas>
<video id="cam" playsinline muted autoplay></video>

<div id="boot">
  <div class="kartu">
    <div class="tanda">✋</div>
    <h1>Puzzle Udara</h1>
    <p id="bootPesan">Menyalakan kamera…</p>
    <div class="memuat" id="bootBar"><i></i></div>
    <ul id="bootBantuan" hidden></ul>
  </div>
</div>

<noscript><p style="padding:24px;text-align:center">Permainan ini membutuhkan JavaScript yang aktif.</p></noscript>

<!-- Pelacak tangan di-host sendiri: tidak ada permintaan ke CDN luar saat bermain. -->
<script src="./mediapipe/hands.js"></script>
<script src="./mediapipe/camera_utils.js"></script>
<script>
/* ============================================================
   PUZZLE UDARA v1.7.0
   Puzzle foto yang dimainkan sepenuhnya dengan gerakan tangan.
   Tanpa mouse, tanpa keyboard, tanpa build step.

   Kendali
     Telunjuk              -> menggerakkan kursor
     Tahan di atas tombol  -> menekan (dwell click, cincin kursor terisi)
     Cubit jempol+telunjuk -> mengambil & menyeret kepingan
     Buka tangan           -> melepas kepingan

   Untuk staf (bukan pemain)
     Ketuk 3x pojok kiri-atas -> paksa kembali ke menu

   Semua aset (model tangan, wasm, font) di-host sendiri. Saat bermain
   tidak ada satu pun permintaan ke jaringan luar.
   Uji coba dengan mouse: tambahkan ?mouse=1 pada URL.

   Peta modul ada di DEV.md.
   ============================================================ */
'use strict';

/* ============================================================
   M1 · Elemen & setelan
   ============================================================ */
var cv        = document.getElementById('stage');
var ctx       = cv.getContext('2d');
var video     = document.getElementById('cam');
var boot      = document.getElementById('boot');
var bootPesan = document.getElementById('bootPesan');
var bootBar   = document.getElementById('bootBar');
var bootHelp  = document.getElementById('bootBantuan');

var TINGKAT = {
  // Tanpa label usia: permainan ini terbuka untuk siapa pun, termasuk orang
  // dewasa. Tingkat dipilih dari selera tantangannya, bukan dari umurnya.
  mudah : { grid:2, nama:'Mudah',  warna:'#35E0A1' },
  sedang: { grid:3, nama:'Sedang', warna:'#45C4FF' },
  sulit : { grid:4, nama:'Sulit',  warna:'#FF5FA2' }
};
var URUT_TINGKAT = ['mudah','sedang','sulit'];

var DWELL        = 1000;   // ms menahan kursor untuk menekan tombol
var CUBIT_ON     = 0.45;   // rasio cubit terhadap ukuran telapak -> menggenggam
var CUBIT_OFF    = 0.62;   // histeresis supaya genggaman tidak berkedip
var GAIN         = 1.30;   // perluas jangkauan tangan ke tepi layar
var SRC          = 720;    // resolusi foto yang dipotong
var DETIK_MUNDUR = 3;
var SNAP         = 0.55;   // toleransi tempel, dikali ukuran sel
var JEDA_PETUNJUK= 22000;  // ms tanpa kemajuan sebelum slot tujuan berkedip
var MP_DIR       = './mediapipe/';  // folder aset MediaPipe yang di-host sendiri
var MODEL        = 1;      // 0 = model ringan (tablet lawas), 1 = akurat

// Kios: jangan tinggalkan foto anak terpampang di layar lobi saat dia pergi.
var IDLE_SIAGA   = 45000;  // ms tanpa tangan sebelum peringatan muncul
var IDLE_PULANG  = 10000;  // ms hitung mundur peringatan sebelum ke menu
var FRAME_MATI   = 2000;   // ms tanpa frame kamera -> anggap tidak ada orang
// Ambang kedua, jauh lebih ketat, khusus untuk dwell. WAJIB di bawah DWELL:
// kalau tidak, kamera yang membeku masih sempat menyelesaikan satu tekanan
// tombol di dalam masa tenggangnya. Longgar sedikit supaya frame yang
// tersendat di tablet lawas tidak membatalkan tekanan yang sedang berjalan.
var FRAME_SEGAR  = 400;    // ms; di atas ini data tangan basi untuk dwell

// Jalan keluar staf tanpa gestur tangan. Di pojok dan butuh tiga ketukan
// supaya anak tidak memicunya tanpa sengaja.
var KETUK_ZONA   = 96;     // px sisi kotak pojok kiri-atas
var KETUK_JEDA   = 1200;   // ms jarak maksimum antar ketukan

// Versus: seberapa jauh pergelangan boleh melewati garis tengah kamera tanpa
// kehilangan kendali, dan hanya selama pemain itu sedang menggenggam. Tanpa
// toleransi ini, pergelangan yang bergetar di dekat garis tengah menukar
// kendali bolak-balik di tengah seretan.
var SISI_MARGIN  = 0.06;   // bagian dari lebar bingkai kamera

var UNGU_MUDA = '#B79CFF';

var KREDIT = 'Dev By : Haritrisna Suryadimarta | 08562717803';

// Identitas tiap pemain. Indeks = sisi layar: 0 kiri, 1 kanan.
var SOSOK = [
  { nama:'Kiri',  warna:'#35E0A1' },
  { nama:'Kanan', warna:'#FF5FA2' }
];

/* ============================================================
   M2 · Keadaan
   ============================================================ */
var W = 0, H = 0, DPR = 1, waktu = 0;
var layar = 'menu';                 // kalibrasi | menu | mundur | main | menang
var mode = 'solo';                  // solo | versus
var tingkat = 'sedang';
var GRID = 3;
var foto = null;
var tombol = [];
var mundurSisa = 0;
var rakMenu  = { x:0, y:0, w:0, h:0 };
var rakMode  = { x:0, y:0, w:0, h:0 };
var konfeti = [], kilau = [], latarKeping = [];
var kamSiap = false;
var lastT = 0;
var pesan = '';
var suaraAktif = true;
var hematGerak = false;
var pakaiMouse = /[?&]mouse=1/.test(location.search);
var pemenang = null;                // pemain yang lebih dulu selesai

/* Satu jam untuk satu ronde, bukan jam per pemain. Di versus pertandingannya
   balapan: keduanya mulai dari foto yang sama pada detik yang sama, dan ronde
   berakhir begitu salah satu selesai — pemain kedua tidak pernah menuntaskan
   puzzle-nya, jadi "waktu pemain kedua" tidak pernah punya nilai. */
var jamMain = 0;                    // ms sejak foto diambil
var waktuMenang = 0;                // jamMain yang dibekukan saat ada yang menang

var kalib = { lihat:0, cubitOk:false, selesai:0 };

var diam = 0;                       // ms tanpa orang di layar bermain
var sejakFrame = FRAME_MATI;        // ms sejak frame kamera terakhir diproses
var ketukN = 0, ketukT = 0;         // ketukan pojok untuk staf
var kunciLayar = null;              // WakeLockSentinel, bila didukung
var galatBeruntun = 0;              // frame galat berturut-turut di loop()

/* Semua keadaan yang dimiliki seorang pemain ada di dalam satu objek di
   sini — kursor, genggaman, papan, kepingan. Mode solo memakai satu elemen,
   versus dua. Inilah yang membuat isolasi antar belahan bukan sekadar
   diharapkan melainkan dijamin: fungsi yang bekerja atas nama seorang pemain
   hanya menerima objeknya sendiri, jadi ia tidak punya jalan untuk menyentuh
   kepingan atau kursor lawan. */
var pemain = [];

function buatPemain(jumlah){
  pemain = [];
  for (var i = 0; i < jumlah; i++){
    pemain.push({
      sisi: i,
      nama: jumlah > 1 ? SOSOK[i].nama : 'Kamu',
      warna: jumlah > 1 ? SOSOK[i].warna : '#FFB020',        // kursor
      warnaPas: jumlah > 1 ? SOSOK[i].warna : 'rgba(53,224,161,.95)',  // kepingan terpasang
      kotak: { x:0, y:0, w:0, h:0 },   // belahan layar miliknya

      cursor: { x:0, y:0, ada:false },
      target: { x:0, y:0 },
      cubit: false,
      hadir: false,                    // ada yang mengendalikan pemain ini
      tangan: null,                    // landmark terakhir; null di mode ?mouse=1
      segar: FRAME_MATI,               // ms sejak kendalinya terakhir terlihat

      hoverId: null, hoverT: 0,

      papan: { x:0, y:0, s:0, cell:0 },
      zonaSebar: [],
      areaMain: { x:0, y:0, w:0, h:0 },

      keping: [],
      digenggam: null,
      tanpaProgres: 0,
      petunjuk: null
    });
  }
}

buatPemain(1);

/* ============================================================
   M3 · Tata letak
   ============================================================ */
function jepit(v, a, b){ return Math.min(Math.max(v, a), b); }

/* Tata letak papan dihitung terhadap *belahan* pemain, bukan terhadap layar.
   Di versus lanskap tiap belahan justru berbentuk potret (tinggi dan sempit),
   jadi papan otomatis memakai susunan potret — papan di atas, kepingan
   berserak di bawahnya. Satu rumus melayani kedua mode. */
function potretKotak(k){ return k.w < k.h * 1.15; }
function potret(){ return potretKotak({ w:W, h:H }); }

function ukur(){
  var lamaW = W || window.innerWidth;
  var lamaH = H || window.innerHeight;

  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(320, window.innerWidth);
  H = Math.max(360, window.innerHeight);

  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  hitungBelahan();
  susunTombol();
  siapkanLatar();

  for (var i = 0; i < pemain.length; i++){
    var p = pemain[i];
    if (p.keping.length) skalakanUlang(p, lamaW, lamaH);
    p.cursor.x = jepit(p.cursor.x, p.kotak.x, p.kotak.x + p.kotak.w);
    p.cursor.y = jepit(p.cursor.y, p.kotak.y, p.kotak.y + p.kotak.h);
  }
}

/* Layar dibelah HANYA saat benar-benar ada dua papan. Menu dan kalibrasi
   dipakai bersama, jadi di situ tiap pemain menjangkau seluruh layar.

   Tanpa pembedaan ini, menu versus mustahil dipakai: kartu tingkat ada di
   tengah layar, sementara tiap pemain terkunci di separuhnya — satu tangan
   hanya bisa menyentuh satu dari dua kartu. */
function layarTerbelah(){
  return pemain.length > 1 &&
         (layar === 'mundur' || layar === 'main' || layar === 'menang');
}

/* Membagi layar jadi belahan per pemain. Versus membelah kiri-kanan —
   searah dengan posisi tangan kedua anak di depan kamera, supaya pemain kiri
   memegang papan kiri tanpa perlu dijelaskan. */
function hitungBelahan(){
  var belah = layarTerbelah();
  for (var i = 0; i < pemain.length; i++){
    var p = pemain[i];
    p.kotak = belah
      ? { x:i * (W / 2), y:0, w:W / 2, h:H }
      : { x:0, y:0, w:W, h:H };
    // Kotak berubah -> tarik kursor ke dalamnya seketika, jangan tunggu
    // beberapa frame penghalusan.
    p.cursor.x = jepit(p.cursor.x, p.kotak.x, p.kotak.x + p.kotak.w);
    p.cursor.y = jepit(p.cursor.y, p.kotak.y, p.kotak.y + p.kotak.h);
    hitungPapan(p);
  }
}

function hitungPapan(p){
  var k = p.kotak;
  var atas = 96, bawah = 112;
  var tinggiMain = Math.max(180, k.h - atas - bawah);
  var s;

  p.areaMain = { x:k.x + 8, y:k.y + atas, w:k.w - 16, h:tinggiMain };

  if (potretKotak(k)){
    s = Math.max(160, Math.min(k.w * 0.88, tinggiMain * 0.62));
    p.papan = { x:k.x + (k.w - s)/2, y:k.y + atas + 2, s:s, cell:s/GRID };
    var yStrip = p.papan.y + s + 14;
    var hStrip = Math.max(p.papan.cell * 1.05, (k.y + atas + tinggiMain) - yStrip);
    p.zonaSebar = [{ x:k.x + 10, y:yStrip, w:Math.max(p.papan.cell, k.w - 20), h:hStrip }];
  } else {
    s = Math.max(160, Math.min(tinggiMain * 0.94, k.w * 0.44));
    p.papan = { x:k.x + (k.w - s)/2, y:k.y + atas + (tinggiMain - s)/2, s:s, cell:s/GRID };
    var pita = Math.max(p.papan.cell * 1.05, (p.papan.x - k.x) - 22);
    p.zonaSebar = [
      { x:k.x + 10, y:k.y + atas, w:pita, h:tinggiMain },
      { x:Math.min(k.x + k.w - pita - 10, p.papan.x + s + 10), y:k.y + atas, w:pita, h:tinggiMain }
    ];
  }
}

/* ============================================================
   M4 · Tombol tanpa sentuh (dwell click)
   ============================================================ */
/* `tuan` menentukan kursor siapa yang boleh menekan tombol ini. null berarti
   milik bersama — itu yang dipakai di menu dan di mode solo. Di versus, tombol
   di tiap belahan bertuan, sehingga seorang anak tidak bisa menekan tombol di
   wilayah lawannya. */
function tbl(id, label, sub, x, y, w, h, warna, aksi, gaya, tuan){
  return { id:id, label:label, sub:sub, x:x, y:y, w:w, h:h,
           warna:warna, aksi:aksi, gaya:gaya || 'pil', grid:0,
           tuan:tuan || null };
}

function susunTombol(){
  tombol = [];
  var w, h, jarak, x0, y, total, i, t, n;

  if (layar === 'kalibrasi'){
    w = Math.min(230, W - 60); h = 62;
    tombol.push(tbl('lewati', 'Lewati', null, (W - w)/2, Math.min(H - h - 26, H * 0.86),
      w, h, UNGU_MUDA, keMenu));
  }

  if (layar === 'menu'){
    // 4x4 dibatasi ke mode solo: di separuh layar kepingannya mengecil dan
    // toleransi tempel ikut mengecil, jadi anak lebih sering gagal menempel.
    var daftarTingkat = (mode === 'versus')
      ? URUT_TINGKAT.slice(0, 2)
      : URUT_TINGKAT;
    n = daftarTingkat.length;
    jarak = 14;
    // Kartu dimulai di bawah pratinjau kamera + judul. Tanpa ini, di lebar
    // HP judul yang di-tengah menabrak pratinjau di pojok kanan-atas.
    var kam = kotakKamera();
    var margAtas  = Math.max(122, H * 0.30, kam.y + kam.h + 104);
    var margBawah = 96;

    // Pilihan mode hanya ditawarkan di lanskap yang cukup tinggi. Versus
    // memang menuntut lanskap, jadi menawarkannya di potret hanya untuk
    // menolaknya lagi lebih membingungkan daripada tidak menawarkannya.
    var bolehMode = !potret() && (H - margAtas - margBawah) >= 200;
    rakMode = { x:0, y:0, w:0, h:0 };
    if (bolehMode){
      var wm = 168, hm = 52, jm = 14;
      var totalM = wm * 2 + jm;
      var xm = (W - totalM) / 2;
      rakMode = { x:xm, y:margAtas, w:totalM, h:hm };
      tombol.push(tbl('mode-solo', '1 Pemain', null, xm, margAtas, wm, hm,
        mode === 'solo' ? '#FFB020' : 'rgba(255,255,255,.28)',
        gantiMode.bind(null, 'solo'), 'kecil'));
      tombol.push(tbl('mode-versus', '2 Pemain', null, xm + wm + jm, margAtas, wm, hm,
        mode === 'versus' ? '#FF5FA2' : 'rgba(255,255,255,.28)',
        gantiMode.bind(null, 'versus'), 'kecil'));
      margAtas += hm + 20;
    }

    var sisa = Math.max(120, H - margAtas - margBawah);

    if (potret()){
      w = Math.min(430, W - 40);
      h = jepit(Math.min(118, (sisa - jarak * (n - 1)) / n), 44, 118);
      total = h * n + jarak * (n - 1);
      x0 = (W - w) / 2;
      y  = margAtas + Math.max(0, (sisa - total) / 2);
      rakMenu = { x:x0, y:y, w:w, h:total };
      for (i = 0; i < n; i++){
        t = TINGKAT[daftarTingkat[i]];
        tombol.push(kartuTingkat(daftarTingkat[i], t, x0, y + i * (h + jarak), w, h));
      }
    } else {
      jarak = 18;
      w = Math.min(258, (W - 48 - jarak * (n - 1)) / n);
      h = jepit(Math.min(150, sisa), 60, 150);
      total = w * n + jarak * (n - 1);
      x0 = (W - total) / 2;
      y  = margAtas + Math.max(0, (sisa - h) / 2);
      rakMenu = { x:x0, y:y, w:total, h:h };
      for (i = 0; i < n; i++){
        t = TINGKAT[daftarTingkat[i]];
        tombol.push(kartuTingkat(daftarTingkat[i], t, x0 + i * (w + jarak), y, w, h));
      }
    }

    var sw = 104, sh = 46;
    tombol.push(tbl('suara', suaraAktif ? 'Suara aktif' : 'Suara mati', null,
      16, 16, sw, sh, suaraAktif ? '#35E0A1' : 'rgba(255,255,255,.45)', gantiSuara, 'kecil'));
  }

  if (layar === 'main'){
    jarak = 12;
    w = Math.min(190, (W - 48 - jarak * 2) / 3);
    h = 60;
    total = w * 3 + jarak * 2;
    x0 = (W - total) / 2;
    y  = Math.min(H - h - 24, H - 84);
    if (pemain.length > 1){
      // Selama bertanding sengaja TIDAK ada tombol keluar. Kalau ada, anak
      // yang kalah bisa membatalkan permainan lawannya sedetik sebelum
      // lawannya menang. Keluar lewat pulang-otomatis saat ditinggal atau
      // ketukan staf 3x di pojok. "Acak lagi" bertuan dan hanya mengacak
      // kepingan pemiliknya sendiri.
      h = 54;
      for (i = 0; i < pemain.length; i++){
        var pm = pemain[i], km = pm.kotak;
        w = Math.min(190, km.w - 48);
        tombol.push(tbl('acak-' + i, 'Acak lagi', null,
          km.x + (km.w - w)/2, Math.min(km.y + km.h - h - 24, km.y + km.h - 78),
          w, h, pm.warna, acakKeping.bind(null, pm), 'pil', pm));
      }
    } else {
      tombol.push(tbl('acak', 'Acak lagi',     null, x0,                 y, w, h, '#45C4FF',
                      acakKeping.bind(null, pemain[0])));
      tombol.push(tbl('foto', 'Foto ulang',    null, x0 + (w + jarak),   y, w, h, '#FFB020', mulaiMundur));
      tombol.push(tbl('menu', 'Ganti tingkat', null, x0 + 2*(w + jarak), y, w, h, UNGU_MUDA, keMenu));
    }
  }

  if (layar === 'menang'){
    jarak = 16;
    w = Math.min(236, (W - 48 - jarak) / 2);
    h = 74;
    total = w * 2 + jarak;
    x0 = (W - total) / 2;
    y  = jepit(H / 2 + 92, 80, H - h - 26);
    tombol.push(tbl('lagi',  'Main lagi',     'foto baru', x0,             y, w, h, '#35E0A1', mulaiMundur));
    tombol.push(tbl('menu2', 'Ganti tingkat', null,        x0 + w + jarak, y, w, h, UNGU_MUDA, keMenu));
  }

  for (var q = 0; q < pemain.length; q++){ pemain[q].hoverId = null; pemain[q].hoverT = 0; }
}

function kartuTingkat(kunci, t, x, y, w, h){
  var b = tbl('lv-' + kunci, t.nama, null, x, y, w, h, t.warna, mulaiTingkat.bind(null, kunci), 'kartu');
  b.grid = t.grid;
  return b;
}

function gantiLayar(l){
  layar = l;
  hitungBelahan();
  susunTombol();
}

/* Berganti mode berarti menyusun ulang pemainnya. Dipanggil dari menu saja,
   jadi tidak ada permainan berjalan yang bisa terganggu. */
function gantiMode(m){
  if (mode === m) return;
  mode = m;
  // 4x4 tidak ditawarkan di versus; kalau sedang terpilih, turunkan.
  if (mode === 'versus' && tingkat === 'sulit') tingkat = 'sedang';
  GRID = TINGKAT[tingkat].grid;
  buatPemain(mode === 'versus' ? 2 : 1);
  hitungBelahan();
  for (var i = 0; i < pemain.length; i++){
    var kq = pemain[i].kotak;
    pemain[i].cursor.x = pemain[i].target.x = kq.x + kq.w / 2;
    pemain[i].cursor.y = pemain[i].target.y = kq.y + kq.h / 2;
  }
  susunTombol();
  bunyi(mode === 'versus' ? 700 : 560, 0.12);
}

function gantiSuara(){
  suaraAktif = !suaraAktif;
  susunTombol();
  if (suaraAktif) bunyi(760, 0.1);
}

/* ============================================================
   M5 · Alur permainan
   ============================================================ */
function mulaiTingkat(k){
  tingkat = k;
  GRID = TINGKAT[k].grid;
  hitungBelahan();
  mulaiMundur();
}

function mulaiMundur(){
  mundurSisa = DETIK_MUNDUR;
  pemenang = null;
  for (var i = 0; i < pemain.length; i++) pemain[i].digenggam = null;
  gantiLayar('mundur');
  bunyi(660, 0.12);
}

function kameraPunyaGambar(){
  return !!(video && video.videoWidth > 0 && video.videoHeight > 0 && video.readyState >= 2);
}

function jepret(){
  if (!kameraPunyaGambar()) return false;
  var vw = video.videoWidth, vh = video.videoHeight;
  var c = document.createElement('canvas');
  c.width = c.height = SRC;
  var g = c.getContext('2d');
  var sisi = Math.min(vw, vh);
  g.translate(SRC, 0); g.scale(-1, 1);        // cermin, agar sama dengan yang dilihat anak
  try {
    g.drawImage(video, (vw - sisi)/2, (vh - sisi)/2, sisi, sisi, 0, 0, SRC, SRC);
  } catch (e){
    return false;                             // frame belum bisa digambar, coba lagi
  }
  // Satu foto, dipakai kedua pemain. Justru itu serunya di mode versus:
  // yang disusun adalah gambar kalian berdua.
  foto = c;
  jamMain = 0; waktuMenang = 0;      // ronde baru, jam mulai dari nol
  for (var i = 0; i < pemain.length; i++) buatKeping(pemain[i]);
  gantiLayar('main');
  pesan = 'Cubit kepingannya, lalu tarik ke tempatnya';
  bunyi(880, 0.16);
  return true;
}

function buatKeping(pm){
  pm.keping = [];
  for (var i = 0; i < GRID * GRID; i++){
    pm.keping.push({ col:i % GRID, row:Math.floor(i / GRID), x:0, y:0, pas:false, anim:null, denyut:0 });
  }
  acakKeping(pm);
}

function acakKeping(pm){
  pm.digenggam = null;
  var sudah = [];
  for (var i = 0; i < pm.keping.length; i++){
    pm.keping[i].pas = false;
    pm.keping[i].anim = null;
    sebar(pm, pm.keping[i], sudah);
    sudah.push(pm.keping[i]);
  }
  pm.tanpaProgres = 0; pm.petunjuk = null;
  if (layar === 'main') pesan = 'Cubit kepingannya, lalu tarik ke tempatnya';
}

/* Titik acak paling renggang dari kepingan lain, supaya tidak menumpuk.
   Zona sebarnya milik pemain itu sendiri, jadi kepingannya tidak pernah
   lahir di belahan lawan. */
function sebar(pm, kp, sudah){
  var c = pm.papan.cell, terbaik = null, skorTerbaik = -1;
  for (var coba = 0; coba < 14; coba++){
    var z = pm.zonaSebar[Math.floor(Math.random() * pm.zonaSebar.length)] || pm.areaMain;
    var kx = z.x + Math.random() * Math.max(1, Math.max(z.x, z.x + z.w - c) - z.x);
    var ky = z.y + Math.random() * Math.max(1, Math.max(z.y, z.y + z.h - c) - z.y);
    var skor = Infinity;
    if (sudah) for (var i = 0; i < sudah.length; i++){
      var d = Math.hypot(kx - sudah[i].x, ky - sudah[i].y);
      if (d < skor) skor = d;
    }
    if (skor > skorTerbaik){ skorTerbaik = skor; terbaik = { x:kx, y:ky }; }
    if (skorTerbaik > c * 0.8) break;
  }
  kp.x = terbaik.x; kp.y = terbaik.y;
  jagaDiArea(pm, kp);   // zona sebar bisa melewati area main di layar pendek
}

/* Resize: pertahankan posisi relatif, jangan diacak ulang. */
function skalakanUlang(pm, lamaW, lamaH){
  var rx = W / (lamaW || W), ry = H / (lamaH || H);
  for (var i = 0; i < pm.keping.length; i++){
    var kp = pm.keping[i];
    kp.anim = null;
    if (kp.pas){
      kp.x = pm.papan.x + kp.col * pm.papan.cell;
      kp.y = pm.papan.y + kp.row * pm.papan.cell;
    } else {
      kp.x *= rx; kp.y *= ry;
      jagaDiArea(pm, kp);
    }
  }
}

function jagaDiArea(pm, kp){
  var c = pm.papan.cell;
  kp.x = jepit(kp.x, pm.areaMain.x, pm.areaMain.x + pm.areaMain.w - c);
  kp.y = jepit(kp.y, pm.areaMain.y, pm.areaMain.y + pm.areaMain.h - c);
}

/* Satu-satunya jalan pulang. Sengaja menghapus foto: di kios lobi, foto anak
   tidak boleh tertinggal di layar untuk dilihat tamu berikutnya. */
function keMenu(){
  foto = null;
  pemenang = null;
  for (var i = 0; i < pemain.length; i++){
    var p = pemain[i];
    p.keping = []; p.digenggam = null;
    p.petunjuk = null; p.tanpaProgres = 0;
  }
  konfeti = []; kilau = [];
  pesan = '';
  diam = 0;
  jamMain = 0; waktuMenang = 0;
  gantiLayar('menu');
}

/* Yang lebih dulu memasang seluruh kepingannya menang. Penjaga `pemenang`
   memastikan pemain kedua yang menyusul beberapa detik kemudian tidak
   menimpa hasilnya. */
function cekMenang(pm){
  if (!pm.keping.length || pemenang) return;
  for (var i = 0; i < pm.keping.length; i++) if (!pm.keping[i].pas) return;
  pemenang = pm;
  waktuMenang = jamMain;             // bekukan sebelum layar berganti
  gantiLayar('menang');
  taburKonfeti();
  bunyi(523, 0.12);
  setTimeout(function(){ bunyi(659, 0.12); }, 120);
  setTimeout(function(){ bunyi(784, 0.26); }, 250);
}

/* ============================================================
   M6 · Cubit: ambil & lepas
   ============================================================ */
/* Inilah jaminan isolasi yang paling penting: `ambil` hanya menelusuri
   `pm.keping`. Kepingan lawan tidak ada dalam daftar yang dilihatnya, jadi
   mengambilnya bukan sekadar dilarang — tidak ada jalannya, bahkan ketika
   dua kepingan berdempetan di garis tengah layar. */
function ambil(pm){
  if (layar !== 'main' || !foto) return;
  var c = pm.papan.cell;
  for (var i = pm.keping.length - 1; i >= 0; i--){
    var kp = pm.keping[i];
    if (kp.pas) continue;
    if (pm.cursor.x >= kp.x && pm.cursor.x <= kp.x + c &&
        pm.cursor.y >= kp.y && pm.cursor.y <= kp.y + c){
      pm.keping.splice(i, 1); pm.keping.push(kp);   // bawa ke lapisan paling atas
      kp.anim = null;
      pm.digenggam = kp;
      pm.hoverId = null; pm.hoverT = 0;
      pm.petunjuk = null; pm.tanpaProgres = 0;
      bunyi(440 + pm.sisi * 60, 0.06, 'triangle', 0.05);
      return;
    }
  }
}

function lepas(pm){
  if (!pm.digenggam) return;
  var kp = pm.digenggam;
  pm.digenggam = null;
  var c = pm.papan.cell;
  var tx = pm.papan.x + kp.col * c, ty = pm.papan.y + kp.row * c;
  if (Math.hypot(kp.x - tx, kp.y - ty) < c * SNAP){
    kp.anim = { x0:kp.x, y0:kp.y, t:0, dur:hematGerak ? 1 : 170 };
    kp.x = tx; kp.y = ty; kp.pas = true; kp.denyut = 1;
    taburKilau(tx + c/2, ty + c/2);
    pm.tanpaProgres = 0; pm.petunjuk = null;
    bunyi(740 + pm.sisi * 90, 0.1, 'square', 0.05);
    cekMenang(pm);
  } else {
    jagaDiArea(pm, kp);                             // jangan menutupi baris tombol
  }
}

/* ============================================================
   M7 · Pelacakan tangan (MediaPipe Hands)
   ============================================================ */
function jarak(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }

/* Setengah bidang kamera milik seorang anak dipetakan ke SELURUH belahan
   layarnya, bukan sekadar dijepit. Tanpa ini tiap anak cuma bisa menjangkau
   separuh papannya sendiri. Di mode solo rumusnya menyederhana persis menjadi
   pemetaan lama, jadi rasa kendalinya tidak berubah sama sekali. */
function layarX(lm, p){
  var k = p.kotak;
  var x = 1 - lm[8].x;                    // dicermin: 0 kiri layar .. 1 kanan
  // Setengah bidang kamera dipetakan ke seluruh belahan hanya saat layar
  // terbelah. Di menu, kursor tiap anak mengikuti posisi tangannya yang
  // sebenarnya — jadi untuk menjangkau sisi seberang ia tinggal menggeser
  // tangannya, bukan tertahan dinding tak terlihat.
  var u = layarTerbelah() ? jepit((x - p.sisi * 0.5) * 2, 0, 1) : x;
  return k.x + jepit((u - 0.5) * GAIN + 0.5, 0, 1) * k.w;
}
function layarY(lm, p){
  var k = p.kotak;
  return k.y + jepit((lm[8].y - 0.5) * GAIN + 0.5, 0, 1) * k.h;
}

/* Posisi pergelangan di layar yang sudah dicermin, 0 kiri .. 1 kanan.
   Pergelangan dipakai, bukan telunjuk, karena ia jauh lebih stabil saat jari
   bergerak mencubit. */
function xPergelangan(lm){ return 1 - lm[0].x; }

/* Boleh tidaknya seorang pemain mengklaim sebuah tangan. Inilah pagar yang
   membuat gestur dua belahan tidak saling tabrak: tangan yang jelas berada di
   belahan lawan tidak pernah lolos di sini. Toleransi melewati garis tengah
   hanya diberikan kepada pemain yang sedang menggenggam. */
function bolehKlaim(p, lm){
  var x = xPergelangan(lm);
  var toleransi = p.digenggam ? SISI_MARGIN : 0;
  return p.sisi === 0 ? (x < 0.5 + toleransi) : (x >= 0.5 - toleransi);
}

function tanganTerdekat(daftar, p){
  var pilih = daftar[0], baik = Infinity;
  for (var i = 0; i < daftar.length; i++){
    var d = Math.hypot(layarX(daftar[i], p) - p.cursor.x,
                       layarY(daftar[i], p) - p.cursor.y);
    if (d < baik){ baik = d; pilih = daftar[i]; }
  }
  return pilih;
}

/* Bagikan tangan yang terdeteksi ke pemain. Satu pemain paling banyak satu
   tangan, sehingga dua tangan di belahan yang sama pun hanya menggerakkan
   satu pemain — seorang anak tidak bisa menguasai dua papan. */
function bagiTangan(daftar){
  var hasil = [], i;
  for (i = 0; i < pemain.length; i++) hasil.push(null);
  if (!daftar || !daftar.length) return hasil;

  if (pemain.length === 1){
    // Solo: pilih tangan terdekat dengan kursor sebelumnya, supaya tangan
    // orang lain yang ikut masuk bingkai tidak merebut kendali di tengah main.
    hasil[0] = tanganTerdekat(daftar, pemain[0]);
    return hasil;
  }

  // Yang sedang menggenggam memilih lebih dulu — seretan yang sedang berjalan
  // lebih berhak atas tangannya daripada pemain yang sedang menganggur.
  var sisa = daftar.slice();
  var urut = (pemain[1].digenggam && !pemain[0].digenggam) ? [1, 0] : [0, 1];
  for (var u = 0; u < urut.length; u++){
    var p = pemain[urut[u]];
    var calon = [];
    for (i = 0; i < sisa.length; i++) if (bolehKlaim(p, sisa[i])) calon.push(sisa[i]);
    if (!calon.length) continue;
    var pilih = tanganTerdekat(calon, p);
    hasil[urut[u]] = pilih;
    sisa.splice(sisa.indexOf(pilih), 1);
  }
  return hasil;
}

function perbaruiPemain(p, lm){
  if (!lm){
    p.tangan = null;
    p.hadir = false;
    if (p.cubit){ p.cubit = false; lepas(p); }
    return;
  }
  p.tangan = lm;
  p.hadir = true;
  p.segar = 0;

  p.target.x = layarX(lm, p);
  p.target.y = layarY(lm, p);
  p.cursor.ada = true;

  // cubit diukur relatif ukuran telapak -> jauh/dekat kamera terasa sama
  var skala = Math.max(1e-4, jarak(lm[0], lm[9]));
  var rasio = jarak(lm[8], lm[4]) / skala;
  var baru = p.cubit ? (rasio < CUBIT_OFF) : (rasio < CUBIT_ON);

  if (baru && !p.cubit){ ambil(p); kalib.cubitOk = true; }
  else if (!baru && p.cubit) lepas(p);
  p.cubit = baru;
}

function onResults(res){
  var daftar = (res && res.multiHandLandmarks) ? res.multiHandLandmarks : [];
  sejakFrame = 0;
  var bagian = bagiTangan(daftar);
  for (var i = 0; i < pemain.length; i++) perbaruiPemain(pemain[i], bagian[i]);
}

/* ============================================================
   M8 · Perbarui
   ============================================================ */
/* `p.tangan` beku pada nilai terakhir kalau aliran frame kamera berhenti
   (kamera dicabut, pipeline mati). Untuk urusan kios itu harus dibaca
   sebagai "tidak ada orang", bukan "tangan masih di situ" — kalau tidak,
   kursor yang kebetulan berhenti di atas tombol akan menekannya sendiri.

   Mode ?mouse=1 dikecualikan: di sana memang tidak ada aliran frame kamera
   yang bisa dipantau kesegarannya. */
function adaOrangP(p){ return p.hadir && (pakaiMouse || p.segar < FRAME_MATI); }

/* Menahan tombol selama satu detik hanya sah kalau datanya benar-benar
   mengalir selama itu. `adaOrangP()` terlalu longgar untuk ini — masa
   tenggangnya lebih panjang dari DWELL, jadi kamera beku masih sempat
   menyelesaikan satu tekanan. */
function frameSegarP(p){ return p.hadir && (pakaiMouse || p.segar < FRAME_SEGAR); }

/* Untuk keputusan tingkat kios: cukup satu pemain terlihat. */
function adaOrang(){
  for (var i = 0; i < pemain.length; i++) if (adaOrangP(pemain[i])) return true;
  return false;
}

/* Dwell untuk seorang pemain. Tombol yang bertuan hanya menanggapi kursor
   tuannya, jadi seorang anak tidak bisa menekan tombol di belahan lawan. */
function dwell(p, dt){
  if (!frameSegarP(p) || p.digenggam || p.cubit){ p.hoverId = null; p.hoverT = 0; return null; }

  var atas = null;
  for (var i = 0; i < tombol.length; i++){
    var b = tombol[i];
    if (b.tuan && b.tuan !== p) continue;
    if (p.cursor.x > b.x && p.cursor.x < b.x + b.w &&
        p.cursor.y > b.y && p.cursor.y < b.y + b.h){ atas = b; break; }
  }
  if (!atas){ p.hoverId = null; p.hoverT = 0; return null; }

  if (atas.id !== p.hoverId){ p.hoverId = atas.id; p.hoverT = 0; bunyi(520, 0.05, 'sine', 0.03); }
  p.hoverT += dt;
  if (p.hoverT < DWELL) return null;

  p.hoverId = null; p.hoverT = 0;
  bunyi(880, 0.1);
  return atas;
}

/* `dt` dijepit 64 ms demi kewarasan animasi dan dwell saat frame tersendat.
   Untuk jam, penjepitan itu racun: di 12 fps jam akan berjalan 77% dari waktu
   nyata — meleset 14 detik per menit, dan dengan perseratus detik itu langsung
   kentara. Jadi jam memakai `dtNyata` yang tidak dijepit sekeras itu.
   Harness memanggil perbarui(dt) tanpa argumen kedua; di situ keduanya sama. */
function perbarui(dt, dtNyata){
  if (dtNyata === undefined) dtNyata = dt;
  waktu += dt;
  sejakFrame += dt;

  var i, p;
  for (i = 0; i < pemain.length; i++){
    p = pemain[i];
    p.segar += dt;

    if (p.cursor.ada){
      var d = Math.hypot(p.target.x - p.cursor.x, p.target.y - p.cursor.y);
      var a = Math.min(0.75, 0.22 + d / 260);   // gesit saat jauh, tenang saat hampir diam
      p.cursor.x += (p.target.x - p.cursor.x) * a;
      p.cursor.y += (p.target.y - p.cursor.y) * a;
    }

    if (p.digenggam){
      if (layar !== 'main') p.digenggam = null;
      else {
        p.digenggam.x = p.cursor.x - p.papan.cell / 2;
        p.digenggam.y = p.cursor.y - p.papan.cell / 2;
      }
    }

    var ditekan = dwell(p, dt);
    if (ditekan){ ditekan.aksi(); return; }     // aksi bisa mengganti layar
  }

  if (layar === 'kalibrasi'){
    if (frameSegarP(pemain[0])) kalib.lihat += dt;
    if (kalib.lihat > 700 && kalib.cubitOk){
      kalib.selesai += dt;
      if (kalib.selesai > 900){ tandaiKalibrasi(); keMenu(); }
    }
  }

  if (layar === 'mundur'){
    mundurSisa -= dt / 1000;
    if (mundurSisa <= 0){ mundurSisa = 0; jepret(); }
  }

  if (layar === 'main'){
    jamMain += dtNyata;
    for (i = 0; i < pemain.length; i++){
      p = pemain[i];
      p.tanpaProgres += dt;
      if (!p.petunjuk && p.tanpaProgres > JEDA_PETUNJUK){
        for (var k = 0; k < p.keping.length; k++){
          if (!p.keping[k].pas){ p.petunjuk = { p:p.keping[k], t:2600 }; break; }
        }
      }
      if (p.petunjuk){
        p.petunjuk.t -= dt;
        if (p.petunjuk.t <= 0){ p.petunjuk = null; p.tanpaProgres = 0; }
      }
    }
  }

  // Ditinggal pergi: pulang ke menu, yang sekaligus menghapus fotonya.
  // Hanya di layar yang memuat foto — menu dan kalibrasi boleh diam selamanya.
  if (layar === 'mundur' || layar === 'main' || layar === 'menang'){
    if (adaOrang()) diam = 0; else diam += dt;
    if (diam >= IDLE_SIAGA + IDLE_PULANG) keMenu();
  } else {
    diam = 0;
  }

  for (i = 0; i < pemain.length; i++){
    var daftar = pemain[i].keping;
    for (var j = 0; j < daftar.length; j++){
      var kp = daftar[j];
      if (kp.anim){ kp.anim.t += dt; if (kp.anim.t >= kp.anim.dur) kp.anim = null; }
      if (kp.denyut > 0) kp.denyut = Math.max(0, kp.denyut - dt / 420);
    }
  }

  majukanPartikel(konfeti, dt, 620, H + 40);
  for (var q = kilau.length - 1; q >= 0; q--){
    var s = kilau[q];
    s.x += s.vx * dt/1000; s.y += s.vy * dt/1000;
    s.vy += 180 * dt/1000; s.hidup -= dt;
    if (s.hidup <= 0) kilau.splice(q, 1);
  }
  if (!hematGerak) for (var b2 = 0; b2 < latarKeping.length; b2++){
    var f = latarKeping[b2];
    f.y -= f.v * dt/1000; f.r += f.vr * dt/1000;
    if (f.y < -f.s) { f.y = H + f.s; f.x = Math.random() * W; }
  }
}

function majukanPartikel(arr, dt, grav, batas){
  for (var i = arr.length - 1; i >= 0; i--){
    var k = arr[i];
    k.vy += grav * dt/1000;
    k.x += k.vx * dt/1000;
    k.y += k.vy * dt/1000;
    k.r += k.vr * dt/1000;
    if (k.y > batas) arr.splice(i, 1);
  }
}

var WARNA_PESTA = ['#FFB020','#35E0A1','#FF5FA2','#45C4FF','#FFFFFF'];

function taburKonfeti(){
  konfeti.length = 0;
  if (hematGerak) return;
  for (var i = 0; i < 130; i++){
    konfeti.push({
      x: W/2 + (Math.random()-0.5) * W * 0.5, y: H * 0.42,
      vx: (Math.random()-0.5) * 620, vy: -Math.random() * 620 - 120,
      r: Math.random() * 6, vr: (Math.random()-0.5) * 10,
      w: 6 + Math.random() * 8, h: 8 + Math.random() * 10,
      c: WARNA_PESTA[Math.floor(Math.random() * WARNA_PESTA.length)]
    });
  }
}

function taburKilau(x, y){
  if (hematGerak) return;
  for (var i = 0; i < 16; i++){
    var a = Math.random() * Math.PI * 2, v = 70 + Math.random() * 190;
    kilau.push({ x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v,
                 hidup:480 + Math.random()*260, maks:740,
                 c: WARNA_PESTA[Math.floor(Math.random() * WARNA_PESTA.length)] });
  }
}

function siapkanLatar(){
  latarKeping = [];
  var n = Math.round(jepit(W * H / 90000, 6, 16));
  for (var i = 0; i < n; i++){
    latarKeping.push({
      x: Math.random() * W, y: Math.random() * H,
      s: 26 + Math.random() * 62, v: 6 + Math.random() * 14,
      r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.25
    });
  }
}

/* ============================================================
   M9 · Primitif gambar
   ============================================================ */
function bulat(x, y, w, h, r){
  var rr = Math.max(0, Math.min(r, w/2, h/2));
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y,     x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x,     y + h, rr);
  ctx.arcTo(x,     y + h, x,     y,     rr);
  ctx.arcTo(x,     y,     x + w, y,     rr);
  ctx.closePath();
}

function teks(t, x, y, ukuran, berat, warna, rata){
  ctx.font = berat + ' ' + ukuran + 'px "Baloo 2", system-ui, sans-serif';
  ctx.fillStyle = warna;
  ctx.textAlign = rata || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y);
}

/* Kecilkan huruf sampai muat selebar `maks`. Label seperti "Ganti tingkat"
   lebih panjang dari pilnya di lebar HP dan tanpa ini meluber keluar. */
function teksMuat(t, x, y, ukuran, berat, warna, rata, maks){
  var u = ukuran;
  for (var i = 0; i < 10 && u > 9; i++){
    ctx.font = berat + ' ' + u + 'px "Baloo 2", system-ui, sans-serif';
    if (ctx.measureText(t).width <= maks) break;
    u = Math.max(9, u * 0.92);
  }
  teks(t, x, y, u, berat, warna, rata);
}

function mulus(t){ return t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3); }

/* Bacaan stopwatch: menit:detik,perseratus. Koma, bukan titik, karena itu
   pemisah desimal bahasa Indonesia dan seluruh antarmuka ini berbahasa
   Indonesia. Bentuknya sama persis saat bermain maupun di layar menang —
   angka yang ditatap pemain selama bermain tidak boleh berubah wujud di akhir. */
function waktuRingkas(ms){
  var total = Math.max(0, Math.floor(ms / 10));   // dalam perseratus detik
  var cs = total % 100;
  var d  = Math.floor(total / 100);
  return Math.floor(d / 60) + ':' + ('0' + (d % 60)).slice(-2) + ',' + ('0' + cs).slice(-2);
}

function latar(){
  var g = ctx.createRadialGradient(W*0.5, H*0.02, 40, W*0.5, H*0.02, Math.max(W, H) * 1.15);
  g.addColorStop(0, '#34177E');
  g.addColorStop(0.55, '#200F55');
  g.addColorStop(1, '#140A38');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Versus: tiap belahan diberi nuansa warna pemiliknya dan dipisah garis,
  // supaya anak tahu wilayahnya tanpa perlu dijelaskan.
  if (layarTerbelah()){
    for (var q = 0; q < pemain.length; q++){
      var pk = pemain[q], kk = pk.kotak;
      ctx.save();
      ctx.globalAlpha = 0.07;
      ctx.fillStyle = pk.warna;
      ctx.fillRect(kk.x, kk.y, kk.w, kk.h);
      ctx.restore();
    }
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.20)';
    ctx.lineWidth = 2;
    ctx.setLineDash([12, 10]);
    ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
    ctx.restore();
  }

  if (layar === 'menu' || layar === 'kalibrasi'){
    ctx.save();
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = '#fff';
    for (var i = 0; i < latarKeping.length; i++){
      var f = latarKeping[i];
      ctx.save();
      ctx.translate(f.x, f.y); ctx.rotate(f.r);
      bulat(-f.s/2, -f.s/2, f.s, f.s, f.s * 0.26);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
}

/* Petak mini sebagai pratinjau tingkat kesulitan pada kartu menu. */
function petakMini(x, y, ukuran, n, warna, alpha){
  var sel = ukuran / n;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = warna;
  ctx.lineWidth = 2;
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++){
    bulat(x + c*sel + 2, y + r*sel + 2, sel - 4, sel - 4, 3);
    ctx.stroke();
  }
  ctx.restore();
}

/* Tombol bertuan hanya menyala untuk tuannya; tombol bersama menyala untuk
   siapa pun yang sedang menahannya. */
function pemainHover(b){
  for (var i = 0; i < pemain.length; i++){
    var p = pemain[i];
    if (b.tuan && b.tuan !== p) continue;
    if (p.hoverId === b.id && p.hoverT > 0) return p;
  }
  return null;
}

function gambarTombol(b){
  var ph = pemainHover(b);
  var aktif = !!ph;
  var p = aktif ? Math.min(1, ph.hoverT / DWELL) : 0;
  var naik = aktif ? 3 : 0;
  var x = b.x, y = b.y - naik, w = b.w, h = b.h;
  var r = b.gaya === 'kartu' ? 26 : 20;

  ctx.save();
  if (aktif){ ctx.shadowColor = b.warna; ctx.shadowBlur = 22; }
  bulat(x, y, w, h, r);
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  ctx.fill();
  ctx.restore();

  ctx.save();                                    // isi mengikuti lama tahan
  bulat(x, y, w, h, r); ctx.clip();
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = b.warna;
  ctx.fillRect(x, y, w * p, h);
  ctx.restore();

  ctx.save();
  bulat(x, y, w, h, r);
  ctx.lineWidth = aktif ? 3 : 2;
  ctx.strokeStyle = aktif ? b.warna : 'rgba(255,255,255,.26)';
  ctx.stroke();
  ctx.restore();

  var gelap = p > 0.55;
  var utama = gelap ? '#140A38' : '#fff';
  var kedua = gelap ? 'rgba(20,10,56,.72)' : 'rgba(255,255,255,.55)';

  if (b.gaya === 'kartu'){
    var lebar = potret();
    var mini = Math.min(h - 26, lebar ? h - 26 : w * 0.34);
    var mx = lebar ? x + 20 : x + (w - mini)/2;
    var my = lebar ? y + (h - mini)/2 : y + 14;
    petakMini(mx, my, mini, b.grid, gelap ? '#140A38' : b.warna, gelap ? 0.5 : 0.85);
    var tx     = lebar ? mx + mini + 18 : x + w/2;
    var rata   = lebar ? 'left' : 'center';
    var yJudul = lebar ? y + h/2 - 11 : my + mini + 16;
    var ySub   = lebar ? y + h/2 + 14 : my + mini + 38;
    var maks   = lebar ? (x + w - 14) - tx : w - 20;
    teksMuat(b.label, tx, yJudul, Math.min(27, h * 0.26), 700, utama, rata, maks);
    teksMuat(b.grid + '×' + b.grid + (b.sub ? ' · ' + b.sub : ''), tx, ySub,
             Math.min(16, h * 0.16), 500, kedua, rata, maks);
  } else if (b.gaya === 'kecil'){
    teksMuat(b.label, x + w/2, y + h/2, 15, 600, utama, 'center', w - 14);
  } else {
    var cy = b.sub ? y + h/2 - 11 : y + h/2;
    teksMuat(b.label, x + w/2, cy, Math.min(22, h * 0.34), 700, utama, 'center', w - 16);
    if (b.sub) teksMuat(b.sub, x + w/2, y + h/2 + 14, 14, 500, kedua, 'center', w - 16);
  }
}

/* ============================================================
   M10 · Papan & kepingan
   ============================================================ */
function gambarPapan(pm){
  var x = pm.papan.x, y = pm.papan.y, s = pm.papan.s, cell = pm.papan.cell;

  ctx.save();
  bulat(x - 8, y - 8, s + 16, s + 16, 28);
  ctx.fillStyle = 'rgba(0,0,0,.30)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.10)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();

  if (foto){
    ctx.save();
    bulat(x, y, s, s, 20); ctx.clip();
    ctx.globalAlpha = 0.15;                      // bayangan gambar utuh sebagai petunjuk
    ctx.drawImage(foto, 0, 0, SRC, SRC, x, y, s, s);
    ctx.restore();
  }

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.14)';
  ctx.lineWidth = 1;
  for (var i = 1; i < GRID; i++){
    ctx.beginPath(); ctx.moveTo(x + i*cell, y); ctx.lineTo(x + i*cell, y + s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y + i*cell); ctx.lineTo(x + s, y + i*cell); ctx.stroke();
  }
  bulat(x, y, s, s, 20);
  ctx.strokeStyle = 'rgba(255,255,255,.32)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  var g = pm.digenggam;
  if (g) sorotSlot(pm, g,
    Math.hypot(g.x - (x + g.col*cell), g.y - (y + g.row*cell)) < cell * SNAP
      ? '#35E0A1' : 'rgba(255,255,255,.45)', 1);

  if (pm.petunjuk && pm.petunjuk.p && !pm.petunjuk.p.pas){
    var kedip = 0.45 + 0.55 * Math.abs(Math.sin(waktu / 260));
    sorotSlot(pm, pm.petunjuk.p, '#FFB020', kedip);
  }
}

function sorotSlot(pm, kp, warna, alpha){
  var c = pm.papan.cell;
  var tx = pm.papan.x + kp.col * c, ty = pm.papan.y + kp.row * c;
  ctx.save();
  ctx.globalAlpha = alpha;
  bulat(tx + 4, ty + 4, c - 8, c - 8, 12);
  ctx.setLineDash([10, 7]);
  ctx.lineWidth = 4;
  ctx.strokeStyle = warna;
  ctx.stroke();
  ctx.restore();
}

function gambarKeping(pm, kp, diangkat){
  if (!foto) return;
  var c = pm.papan.cell, sc = SRC / GRID;
  var px = kp.x, py = kp.y, skala = 1;

  if (kp.anim){
    var k = mulus(kp.anim.t / kp.anim.dur);
    px = kp.anim.x0 + (kp.x - kp.anim.x0) * k;
    py = kp.anim.y0 + (kp.y - kp.anim.y0) * k;
  }
  if (diangkat) skala = 1.07;
  else if (kp.denyut > 0) skala = 1 + 0.10 * Math.sin(kp.denyut * Math.PI);

  ctx.save();
  ctx.translate(px + c/2, py + c/2);
  ctx.scale(skala, skala);
  ctx.translate(-c/2, -c/2);

  if (diangkat){
    ctx.shadowColor = 'rgba(0,0,0,.6)';
    ctx.shadowBlur = 28;
    ctx.shadowOffsetY = 12;
  }
  bulat(0, 0, c, c, 11);
  ctx.save(); ctx.clip();
  ctx.drawImage(foto, kp.col * sc, kp.row * sc, sc, sc, 0, 0, c, c);
  ctx.restore();
  ctx.lineWidth = kp.pas ? 3 : 2.5;
  // Kepingan yang sudah pas diberi warna pemiliknya, supaya di versus jelas
  // papan siapa yang sedang terisi.
  ctx.strokeStyle = kp.pas ? pm.warnaPas : 'rgba(255,255,255,.8)';
  ctx.stroke();
  ctx.restore();
}

/* ============================================================
   M11 · Kursor & pratinjau kamera
   ============================================================ */

/* Kotak pratinjau kamera di pojok kanan-atas — satu-satunya sumber posisinya.
   Layar menu dan layar main memakainya untuk menyisakan ruang, supaya judul
   dan bilah kemajuan tidak tertimpa di layar sempit.

   Ruangnya disisakan tanpa melihat kamSiap: tata letak dihitung sekali di
   ukur()/susunTombol(), sedangkan pratinjaunya baru muncul beberapa detik
   kemudian. Kalau ikut kamSiap, tata letak tidak pernah dihitung ulang dan
   tabrakannya balik lagi. */
function kotakKamera(){
  // Saat bertanding, pratinjau pindah ke tengah-atas dan sedikit diperbesar:
  // isinya dua anak sekaligus, dan di pojok kanan hanya anak kanan yang
  // sempat memastikan dirinya terlihat kamera.
  if (layarTerbelah()){
    var wv = Math.min(220, W * 0.17);
    return { x:(W - wv)/2, y:16, w:wv, h:wv * 0.75 };
  }
  var w = Math.min(150, W * 0.28);
  return { x:W - w - 16, y:16, w:w, h:w * 0.75 };
}

function gambarKursor(pm){
  if (!pm.cursor.ada || !adaOrangP(pm)) return;  // kamera mati -> kursor ikut hilang
  var cx = pm.cursor.x, cy = pm.cursor.y;
  var r = pm.cubit ? 14 : 23;
  var warna = pm.cubit ? '#35E0A1' : pm.warna;

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r + 7, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fill();

  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.stroke();

  if (pm.hoverId && pm.hoverT > 0){               // cincin dwell mengelilingi kursor
    var maju = Math.min(1, pm.hoverT / DWELL);
    ctx.beginPath();
    ctx.arc(cx, cy, r + 4, -Math.PI/2, -Math.PI/2 + maju * Math.PI * 2);
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.strokeStyle = warna;
    ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.lineWidth = 4;
    ctx.strokeStyle = warna;
    ctx.stroke();
  }

  ctx.beginPath(); ctx.arc(cx, cy, 4.5, 0, Math.PI*2);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.restore();
}

var SAMBUNG = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
               [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function gambarKamera(x, y, w, h, label){
  var r = 16;
  ctx.save();
  bulat(x, y, w, h, r); ctx.clip();
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.fillRect(x, y, w, h);
  ctx.translate(x + w, y); ctx.scale(-1, 1);
  if (kameraPunyaGambar()){
    try {
      var vw = video.videoWidth, vh = video.videoHeight;
      var sisi = Math.min(vw, vh * (w / h));
      ctx.globalAlpha = 0.62;
      ctx.drawImage(video, (vw - sisi)/2, 0, sisi, vh, 0, 0, w, h);
      ctx.globalAlpha = 1;
    } catch (e){ /* frame belum siap */ }
  }
  // Rangka semua tangan yang sedang dipakai, diwarnai pemiliknya — di versus
  // itulah cara anak memastikan kamera benar-benar mengenali tangannya.
  for (var q = 0; q < pemain.length; q++){
    var pm = pemain[q], lm = pm.tangan;
    if (!lm) continue;
    ctx.strokeStyle = pm.cubit ? '#35E0A1' : pm.warna;
    ctx.lineWidth = Math.max(2, w / 70);
    for (var i = 0; i < SAMBUNG.length; i++){
      var a = lm[SAMBUNG[i][0]], b = lm[SAMBUNG[i][1]];
      ctx.beginPath();
      ctx.moveTo(a.x * w, a.y * h); ctx.lineTo(b.x * w, b.y * h);
      ctx.stroke();
    }
    ctx.fillStyle = '#fff';
    for (var j = 0; j < lm.length; j++){
      ctx.beginPath(); ctx.arc(lm[j].x * w, lm[j].y * h, Math.max(2, w/60), 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();

  ctx.save();
  bulat(x, y, w, h, r);
  ctx.strokeStyle = adaOrang() ? 'rgba(53,224,161,.6)' : 'rgba(255,255,255,.2)';
  ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();

  if (label) teks(label, x + w/2, y + h + 14, 13, 600, 'rgba(255,255,255,.45)');
}

/* Rata kiri, bukan di tengah: pratinjau kamera memakai pojok kanan-atas
   dan di lebar HP (<= ~420px) bilah yang di-tengah selalu tertimpa. */
function bilahKotak(pm){
  var k = pm.kotak, y = k.y + 62, h = 9;

  if (layarTerbelah()){
    // Tiap bilah menempel ke tepi LUAR belahannya, menjauh dari garis tengah
    // tempat pratinjau kamera berada. Label pemain kanan ikut rata kanan,
    // jadi tiap anak membaca skornya di pojok terdekat dengannya.
    var lebar = Math.max(72, Math.min(280, k.w - 32));
    var kiri = (pm.sisi === 0) ? k.x + 16 : k.x + k.w - 16 - lebar;
    return { x:kiri, y:y, h:h, w:lebar,
             rata:(pm.sisi === 0 ? 'left' : 'right'),
             xLabel:(pm.sisi === 0 ? kiri : kiri + lebar) };
  }

  var x = k.x + 16;
  var batasKanan = kotakKamera().x - 14;
  var w = Math.max(72, Math.min(280, batasKanan - x));
  return { x:x, y:y, h:h, w:w, rata:'left', xLabel:x };
}

function gambarBilah(pm, selesai, jumlah){
  var k = bilahKotak(pm), x = k.x, y = k.y, w = k.w, h = k.h;
  ctx.save();
  bulat(x, y, w, h, 99);
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fill();
  if (selesai > 0 && jumlah > 0){
    bulat(x, y, Math.max(h, w * (selesai / jumlah)), h, 99);
    ctx.fillStyle = pm.warnaPas; ctx.fill();
  }
  ctx.restore();
  var label = (pemain.length > 1 ? pm.nama + '  ' : '') + selesai + ' / ' + jumlah;
  // Lebar dibagi supaya pencacah dan jam tidak mungkin bertabrakan di layar
  // sempit, sekecil apa pun bilahnya.
  teksMuat(label, k.xLabel, pm.kotak.y + 34, 25, 700, '#fff', k.rata, w * 0.55);

  // Di versus jamnya bersama dan digambar di tengah, bukan di tiap belahan.
  if (!layarTerbelah()){
    teksMuat(waktuRingkas(jamMain), x + w, pm.kotak.y + 34, 22, 700,
             'rgba(255,255,255,.8)', 'right', w * 0.42);
  }
}

/* Jam bersama mode versus: di tengah, tepat di bawah pratinjau kamera, di
   celah antara kedua papan. Keduanya menatap angka yang sama — itu yang
   membuatnya terasa balapan, bukan dua permainan yang kebetulan berdampingan. */
function gambarJam(){
  if (!layarTerbelah()) return;
  var kam = kotakKamera();
  teksMuat(waktuRingkas(jamMain), W/2, kam.y + kam.h + 28,
           Math.min(30, W * 0.024), 800, '#fff', 'center', kam.w + 40);
}

function gambarMain(){
  var terbelah = layarTerbelah();
  var adaPetunjuk = false;
  for (var q = 0; q < pemain.length; q++){
    var pm = pemain[q], i, selesai = 0;
    if (pm.petunjuk) adaPetunjuk = true;

    gambarPapan(pm);
    for (i = 0; i < pm.keping.length; i++) if (pm.keping[i].pas) selesai++;
    for (i = 0; i < pm.keping.length; i++)
      if (pm.keping[i].pas && pm.keping[i] !== pm.digenggam) gambarKeping(pm, pm.keping[i], false);
    for (i = 0; i < pm.keping.length; i++)
      if (!pm.keping[i].pas && pm.keping[i] !== pm.digenggam) gambarKeping(pm, pm.keping[i], false);
    if (pm.digenggam) gambarKeping(pm, pm.digenggam, true);

    gambarBilah(pm, selesai, pm.keping.length);

    // Saat terbelah, pesan ditulis di dalam belahan pemiliknya — kalimat yang
    // melintasi garis tengah membuat anak bingung itu ditujukan kepada siapa.
    if (terbelah && pm.petunjuk){
      teksMuat('Kotak yang berkedip itu tempatnya',
               pm.kotak.x + pm.kotak.w/2, H - 96, Math.min(15, pm.kotak.w * 0.04),
               500, '#FFB020', 'center', pm.kotak.w - 40);
    }
  }

  gambarJam();     // bersama, jadi sekali saja - di luar loop pemain

  if (!terbelah){
    var ket = adaPetunjuk ? 'Lihat kotak yang berkedip — kepingan itu tempatnya di situ' : pesan;
    teks(ket, W/2, H - 96, Math.min(15, W * 0.033), 500,
         adaPetunjuk ? '#FFB020' : 'rgba(255,255,255,.45)');
  }
}

function bintang(x, y, r, warna){
  ctx.save();
  ctx.beginPath();
  for (var i = 0; i < 10; i++){
    var rad = (i % 2 === 0) ? r : r * 0.45;
    var a = -Math.PI/2 + i * Math.PI/5;
    ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a)*rad, y + Math.sin(a)*rad);
  }
  ctx.closePath();
  ctx.fillStyle = warna; ctx.fill();
  ctx.restore();
}

function gambarMenang(){
  for (var q = 0; q < pemain.length; q++){
    var pm = pemain[q];
    gambarPapan(pm);
    for (var i = 0; i < pm.keping.length; i++) gambarKeping(pm, pm.keping[i], false);
  }
  ctx.fillStyle = 'rgba(20,10,56,.74)';
  ctx.fillRect(0, 0, W, H);

  var cy = Math.min(H/2 - 36, H * 0.42);
  for (var b = 0; b < 3; b++){
    var d = (b - 1) * 54;
    var naik = hematGerak ? 0 : Math.sin(waktu/420 + b) * 5;
    bintang(W/2 + d, cy - 76 + naik, b === 1 ? 26 : 20, '#FFB020');
  }
  if (pemenang && pemain.length > 1){
    var lawan = pemain[pemenang.sisi === 0 ? 1 : 0];
    var majuLawan = 0;
    for (var z = 0; z < lawan.keping.length; z++) if (lawan.keping[z].pas) majuLawan++;
    teksMuat('Pemain ' + pemenang.nama + ' menang!', W/2, cy,
             Math.min(54, W * 0.09), 800, pemenang.warnaPas, 'center', W - 60);
    teksMuat(waktuRingkas(waktuMenang), W/2, cy + 46,
             Math.min(30, W * 0.05), 800, '#FFB020', 'center', W - 80);
    teksMuat('Lawannya sampai ' + majuLawan + ' dari ' + lawan.keping.length + ' kepingan',
             W/2, cy + 80, Math.min(18, W * 0.028), 500, 'rgba(255,255,255,.7)', 'center', W - 80);
  } else {
    teks('Selesai!', W/2, cy, Math.min(58, W * 0.125), 800, '#35E0A1');
    teksMuat(waktuRingkas(waktuMenang), W/2, cy + 46,
             Math.min(34, W * 0.065), 800, '#FFB020', 'center', W - 60);
    teksMuat((GRID * GRID) + ' kepingan, tanpa menyentuh apa pun',
             W/2, cy + 82, Math.min(18, W * 0.038), 500, 'rgba(255,255,255,.7)', 'center', W - 80);
  }
}

function gambarPartikel(){
  var i, k;
  for (i = 0; i < konfeti.length; i++){
    k = konfeti[i];
    ctx.save();
    ctx.translate(k.x, k.y); ctx.rotate(k.r);
    ctx.fillStyle = k.c;
    ctx.fillRect(-k.w/2, -k.h/2, k.w, k.h);
    ctx.restore();
  }
  for (i = 0; i < kilau.length; i++){
    k = kilau[i];
    ctx.save();
    ctx.globalAlpha = Math.max(0, k.hidup / k.maks);
    ctx.fillStyle = k.c;
    ctx.beginPath(); ctx.arc(k.x, k.y, 3, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

/* Peringatan sebelum pulang otomatis. Digambar paling atas supaya tidak
   tertutup kepingan, dan cukup besar untuk terbaca dari jarak berdiri. */
function gambarSiagaIdle(){
  if (diam < IDLE_SIAGA) return;
  var sisa = Math.max(1, Math.ceil((IDLE_SIAGA + IDLE_PULANG - diam) / 1000));
  var w = Math.min(430, W - 40), x = (W - w)/2;
  var h = 92, y = Math.max(8, H/2 - h/2);

  ctx.save();
  ctx.fillStyle = 'rgba(20,10,56,.82)';
  ctx.fillRect(0, 0, W, H);
  bulat(x, y, w, h, 22);
  ctx.fillStyle = 'rgba(255,176,32,.16)'; ctx.fill();
  ctx.strokeStyle = '#FFB020'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();

  teksMuat('Masih di sini?', x + w/2, y + 30, 24, 700, '#FFB020', 'center', w - 28);
  teksMuat('Angkat tangan, atau kembali ke menu dalam ' + sisa,
           x + w/2, y + 62, 16, 500, 'rgba(255,255,255,.75)', 'center', w - 28);
}

function gambar(){
  latar();
  if (layar === 'kalibrasi') gambarKalibrasi();
  if (layar === 'menu')      gambarMenu();
  if (layar === 'mundur')    gambarMundur();
  if (layar === 'main')      gambarMain();
  if (layar === 'menang')    gambarMenang();

  for (var i = 0; i < tombol.length; i++) gambarTombol(tombol[i]);
  gambarPartikel();

  if (layar === 'menu' || layar === 'main' || layar === 'menang'){
    var k = kotakKamera();
    if (kamSiap) gambarKamera(k.x, k.y, k.w, k.h, null);
  }
  gambarSiagaIdle();
  for (var q = 0; q < pemain.length; q++) gambarKursor(pemain[q]);
}

/* Kios tanpa penunggu: satu galat sesaat ditelan, tapi galat yang terus
   berulang berarti rusak permanen dan layar lobi membeku tanpa ada yang tahu.
   Muat ulang sekali; kalau setelah itu masih rusak, tampilkan kartu bantuan
   supaya staf tahu harus berbuat apa — jangan berputar muat ulang selamanya. */
var BATAS_GALAT = 60;               // frame galat berturut-turut (~1 detik)

function sudahPernahPulih(){
  try { return window.sessionStorage.getItem('puzzleudara.pulih') === '1'; }
  catch (e){ return false; }
}
function tandaiPulih(){
  try { window.sessionStorage.setItem('puzzleudara.pulih', '1'); } catch (e){}
}

function tanganiGalatBeruntun(){
  if (galatBeruntun !== BATAS_GALAT) return;   // tepat sekali, bukan tiap frame
  if (sudahPernahPulih() || !location.reload){
    gagal('Permainan berhenti karena galat berulang.', [
      'Muat ulang halaman dari menu browser.',
      'Kalau tetap terjadi, buka Console browser dan catat pesan merahnya.'
    ]);
    return;
  }
  tandaiPulih();
  location.reload();
}

/* Loop dibungkus try/catch: satu galat gambar tidak membekukan permainan. */
function loop(t){
  // Dua ukuran waktu dari satu frame: `dt` dijepit ketat untuk animasi, dan
  // `dtNyata` dijepit longgar untuk jam. Batas 1 detik menjaga jam tetap benar
  // sampai 1 fps, tapi tetap mencegah lompatan berjam-jam saat tab yang lama
  // tersembunyi kembali aktif.
  var lewat = t - lastT;
  var dt = Math.min(64, lewat);
  var dtNyata = Math.min(1000, lewat);
  lastT = t;
  try { perbarui(dt, dtNyata); gambar(); galatBeruntun = 0; }
  catch (e){
    if (console && console.error) console.error('[puzzle-udara]', e);
    galatBeruntun++;
    try { tanganiGalatBeruntun(); } catch (e2){}
  }
  requestAnimationFrame(loop);
}

/* ============================================================
   M13 · Suara
   ============================================================ */
var actx = null, suaraMati = false;
function bunyi(freq, dur, tipe, vol){
  if (suaraMati || !suaraAktif) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ suaraMati = true; return; }
    if (!actx) actx = new AC();
    if (actx.state === 'suspended'){
      var pr = actx.resume();
      if (pr && pr.catch) pr.catch(function(){});
    }
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = tipe || 'sine';
    o.frequency.value = freq;
    g.gain.value = (vol == null) ? 0.07 : vol;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur || 0.1));
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + (dur || 0.1) + 0.02);
  } catch (e){ suaraMati = true; }
}

/* ============================================================
   M14 · Cadangan mouse & jalan keluar staf
   ============================================================ */
if (pakaiMouse){
  window.addEventListener('mousemove', function(e){
    var p = pemain[0];
    if (p.tangan) return;
    p.cursor.ada = true;
    p.hadir = true;
    p.segar = 0;
    p.target.x = p.cursor.x = e.clientX;
    p.target.y = p.cursor.y = e.clientY;
  });
  window.addEventListener('mousedown', function(){
    var p = pemain[0];
    if (!p.tangan){ p.cubit = true;  ambil(p); }
  });
  window.addEventListener('mouseup',   function(){
    var p = pemain[0];
    if (!p.tangan){ p.cubit = false; lepas(p); }
  });
}

/* Satu-satunya cara staf hotel mengembalikan permainan tanpa gestur tangan.
   Kalau pelacakan bermasalah, tanpa ini layar kios tidak bisa diapa-apakan
   selain me-reload browser — dan staf lobi tidak selalu bisa melakukannya.
   Tiga ketukan di pojok supaya anak tidak memicunya tanpa sengaja. */
function ketukPojok(x, y){
  if (x > KETUK_ZONA || y > KETUK_ZONA){ ketukN = 0; return false; }
  var t = waktu;
  if (t - ketukT > KETUK_JEDA) ketukN = 0;
  ketukT = t;
  ketukN++;
  if (ketukN < 3) return false;
  ketukN = 0;
  bunyi(520, 0.14, 'square', 0.05);
  keMenu();
  return true;
}

/* Kios tablet: sembunyikan address bar supaya anak tidak mengetuknya.
   Butuh gestur pengguna, jadi hanya bisa dipicu dari sentuhan — mode kios
   lewat flag Chrome tetap jalur yang lebih andal (lihat README). */
function cobaLayarPenuh(){
  var el = document.documentElement;
  var minta = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!minta || document.fullscreenElement) return;
  try {
    var pr = minta.call(el);
    if (pr && pr.catch) pr.catch(function(){});
  } catch (e){}
}

/* ============================================================
   M15 · Kamera + MediaPipe
   ============================================================ */
function gagal(judul, langkah){
  bootPesan.textContent = judul;
  bootBar.hidden = true;
  bootHelp.hidden = false;
  bootHelp.innerHTML = langkah.map(function(l){ return '<li>' + l + '</li>'; }).join('');
  boot.hidden = false;
}

function pesanKameraGagal(e){
  var n = (e && e.name) || '';
  if (n === 'NotAllowedError' || n === 'SecurityError') return ['Izin kamera ditolak.', [
    'Klik ikon kamera di address bar, pilih <b>Izinkan</b>, lalu muat ulang halaman.',
    'Di Android Chrome: menu ⋮ → Setelan situs → Kamera → Izinkan.'
  ]];
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return ['Kamera tidak ditemukan.', [
    'Pastikan perangkat punya kamera depan yang aktif.',
    'Colokkan webcam eksternal lalu muat ulang halaman.'
  ]];
  if (n === 'NotReadableError' || n === 'AbortError') return ['Kamera sedang dipakai aplikasi lain.', [
    'Tutup Zoom, Google Meet, OBS, atau tab lain yang memakai kamera.',
    'Muat ulang halaman setelah aplikasi itu tertutup.'
  ]];
  return ['Kamera tidak bisa dibuka.', [
    'Muat ulang halaman dan izinkan akses kamera.',
    'Halaman harus dibuka lewat <b>https://</b> atau <b>http://localhost</b>.'
  ]];
}

function sudahPernahKalibrasi(){
  try { return window.localStorage.getItem('puzzleudara.kalibrasi') === '1'; }
  catch (e){ return false; }
}
function tandaiKalibrasi(){
  try { window.localStorage.setItem('puzzleudara.kalibrasi', '1'); } catch (e){}
}

/* Kios: tanpa ini layar tablet tidur di tengah sesi dan permainan
   seolah-olah mati. Kuncinya dilepas browser saat tab tersembunyi,
   jadi harus diminta ulang setiap kali tab kembali terlihat. */
function jagaLayarNyala(){
  if (!navigator.wakeLock || !navigator.wakeLock.request) return;
  try {
    var pr = navigator.wakeLock.request('screen');
    if (!pr || !pr.then) return;
    pr.then(function(kunci){
      kunciLayar = kunci;
      if (kunci && kunci.addEventListener){
        kunci.addEventListener('release', function(){ kunciLayar = null; });
      }
    }, function(){ /* ditolak browser; permainan tetap jalan */ });
  } catch (e){}
}

function nyalakan(){
  if (typeof Hands === 'undefined' || typeof Camera === 'undefined'){
    gagal('Berkas pelacak tangan tidak ditemukan.', [
      'Pastikan folder <b>mediapipe/</b> ikut ter-upload di sebelah index.html.',
      'Jalankan <b>npm run setup</b> untuk mengunduh ulang asetnya.',
      'Muat ulang halaman.'
    ]);
    return;
  }

  var hands;
  try {
    hands = new Hands({ locateFile: function(f){ return MP_DIR + f; } });
    hands.setOptions({
      // Dua tangan permanen, bukan diatur ulang saat berganti mode:
      // menyusun ulang graf MediaPipe di tengah jalan berisiko tersendat.
      // Di solo, bagiTangan() memilih satu tangan terdekat dengan kursor —
      // yang kebetulan memperbaiki perilaku lama, ketika tangan orang tua
      // yang ikut masuk bingkai bisa merebut kendali.
      maxNumHands: 2,
      modelComplexity: MODEL,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });
    hands.onResults(function(res){
      if (!kamSiap){
        kamSiap = true;
        boot.hidden = true;
        if (!sudahPernahKalibrasi()) gantiLayar('kalibrasi');
      }
      try { onResults(res); }
      catch (e){ if (console && console.error) console.error('[puzzle-udara] onResults', e); }
    });
  } catch (e){
    gagal('Pelacak tangan gagal disiapkan di browser ini.', [
      'Gunakan Chrome, Edge, atau Safari versi terbaru.',
      'Browser perlu mendukung WebAssembly.'
    ]);
    return;
  }

  var kamera = new Camera(video, {
    onFrame: function(){
      if (document.hidden) return Promise.resolve();   // hemat CPU saat tab tidak aktif
      // camera_utils memanggil onFrame() tanpa try/catch dan hanya melanjutkan
      // rantai requestAnimationFrame-nya lewat .then(). Satu lemparan sinkron
      // dari hands.send() akan mematikan pengiriman frame selamanya: permainan
      // tetap tergambar tapi tangan berhenti terdeteksi tanpa pesan apa pun.
      try { return hands.send({ image: video }).catch(function(){}); }
      catch (e){ return Promise.resolve(); }
    },
    width: 640, height: 480, facingMode: 'user'
  });

  bootPesan.textContent = 'Izinkan akses kamera untuk mulai bermain';

  // camera_utils menampilkan alert() berbahasa Inggris ("Failed to acquire
  // camera feed: …") sebelum melempar errornya. Di kios itu membingungkan;
  // kartu bantuan berbahasa Indonesia di bawah sudah menggantikannya.
  var alertAsli = window.alert;
  var alertDibungkam = true;
  window.alert = function(){};
  function pulihkanAlert(){
    if (!alertDibungkam) return;
    alertDibungkam = false;
    window.alert = alertAsli;
  }

  Promise.resolve(kamera.start())
    .then(function(){
      pulihkanAlert();
      bootPesan.textContent = 'Memuat pelacak tangan…';
      jagaLayarNyala();
    })
    .catch(function(e){ pulihkanAlert(); var p = pesanKameraGagal(e); gagal(p[0], p[1]); });

  setTimeout(function(){
    pulihkanAlert();                              // jaga-jaga bila start() tak pernah selesai
    if (!kamSiap && bootHelp.hidden){
      gagal('Pelacak tangan lama sekali dimuat.', [
        'Cek apakah semua berkas di folder <b>mediapipe/</b> lengkap.',
        'Buka Console browser untuk melihat berkas mana yang 404.',
        'Muat ulang halaman.'
      ]);
    }
  }, 20000);
}

/* ============================================================
   M16 · Mulai
   ============================================================ */
if (location.protocol === 'file:'){
  gagal('Halaman dibuka sebagai berkas biasa (file://).', [
    'Browser hanya mengizinkan kamera pada <b>https://</b> atau <b>http://localhost</b>.',
    'Jalankan <b>npm start</b> di folder ini, lalu buka <b>http://localhost:5500</b>.',
    'Atau klik kanan index.html di VS Code → <b>Open with Live Server</b>.'
  ]);
} else if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
  gagal('Browser ini tidak mendukung akses kamera.', [
    'Gunakan Chrome, Edge, Firefox, atau Safari versi terbaru.',
    'Pastikan alamat situs memakai <b>https://</b>.'
  ]);
} else {
  try { hematGerak = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  catch (e){ hematGerak = false; }

  window.addEventListener('resize', ukur);
  window.addEventListener('orientationchange', function(){ setTimeout(ukur, 250); });
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  // Satu-satunya sentuhan yang didengar permainan: jalan keluar staf, dan
  // kesempatan sah meminta layar penuh (browser menolaknya tanpa gestur).
  window.addEventListener('pointerdown', function(e){
    if (!pakaiMouse) cobaLayarPenuh();   // saat ?mouse=1 tiap klik jadi mengganggu
    ketukPojok(e.clientX, e.clientY);
  });

  // Browser melepas wake lock setiap tab tersembunyi; minta lagi saat kembali.
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && !kunciLayar) jagaLayarNyala();
  });

  // Hanya di produksi. Di localhost cache service worker cuma bikin bingung
  // saat mengembangkan — berkas yang baru diedit tidak kunjung muncul.
  if (location.protocol === 'https:' && navigator.serviceWorker){
    window.addEventListener('load', function(){
      try { navigator.serviceWorker.register('./sw.js').catch(function(){}); }
      catch (e){}
    });
  }

  ukur();
  // Tiap kursor mulai di tengah belahannya sendiri, bukan di tengah layar.
  for (var q = 0; q < pemain.length; q++){
    var pq = pemain[q], kq = pq.kotak;
    pq.cursor.x = pq.target.x = kq.x + kq.w / 2;
    pq.cursor.y = pq.target.y = kq.y + kq.h / 2;
  }
  lastT = performance.now();
  requestAnimationFrame(loop);

  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ try { gambar(); } catch (e){} });
  }
  nyalakan();
}
</script>
